}
function addCustom(k) {
  const inp = $(k+"-i"), v = inp.value.trim().replace(/\s+/g," ");
  if (v.length < 2) return; if (!sel[k].items.some(i => i.c === v)) sel[k].items.push({c:v});
  inp.value = ""; err(k,""); renderTags(k); refresh();
}
["spec","cui"].forEach(k => { $(k+"-b").addEventListener("click", () => addCustom(k)); $(k+"-i").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addCustom(k); } }); });

/* ===== المعاينة + التقدم ===== */
function refresh() {
  const name = $("display_name").value.trim(), ok = [name.length >= 2, !!$("country").value, sel.spec.items.length > 0, sel.cui.items.length > 0, $("bio").value.trim().length >= 10].filter(Boolean).length;
  $("bar").style.width = ok*20 + "%"; $("meterT").textContent = t("meter",{n:ok});
  $("pn").textContent = name || t("prevName"); $("av").textContent = name ? [...name][0].toUpperCase() : "A";
  $("pc").textContent = $("country").value ? $("country").selectedOptions[0].textContent : "";
  const pc = $("pchips"); pc.textContent = ""; sel.spec.items.slice(0,4).forEach(i => pc.append(chipEl(label("spec", i), true)));
  pc.querySelectorAll("svg").forEach(s => s.remove());
}
$("form").addEventListener("input", refresh);
$("country").addEventListener("change", () => { err("country",""); const d = DIAL[$("country").value]; if (d && (!$("wcc").value || $("wcc").value === autoCc)) { $("wcc").value = d; autoCc = d; } refresh(); });
$("bio").addEventListener("input", () => { $("cnt").textContent = $("bio").value.length + " / 600"; });
$("consent").addEventListener("change", e => { $("wbox").hidden = !e.target.checked; if (!e.target.checked) { err("wcc",""); err("wn",""); } });

/* ===== Turnstile ===== */
function mountTS() {
  const box = $("ts"); box.textContent = ""; tsToken = ""; err("ts","");
  if (!TURNSTILE_SITE_KEY) { const d = document.createElement("div"); d.className = "setup"; d.textContent = t("tsSetup"); box.append(d); return; }
  if (!window.turnstile) return;
  try { if (tsId !== null) window.turnstile.remove(tsId); } catch {}
  tsId = window.turnstile.render(box, {sitekey:TURNSTILE_SITE_KEY, theme:"light", language:L, callback:tk => { tsToken = tk; err("ts",""); }, "expired-callback":() => { tsToken = ""; }, "error-callback":() => { tsToken = ""; err("ts", t("tsErr")); }});
}
function loadTS() {
  if (!TURNSTILE_SITE_KEY) return mountTS();
  const s = document.createElement("script"); s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"; s.async = true;
  s.onload = mountTS; s.onerror = () => err("ts", t("tsFail")); document.head.append(s);
}

/* ===== اللغة ===== */
function applyLang(l) {
  L = T[l] ? l : "ar"; const h = document.documentElement; h.lang = L; h.dir = L === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach(e => { e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === L)));
  $("top").setAttribute("aria-label", t("top"));
  document.title = L === "ar" ? "انضم إلى طهاة القرماني إكس | AQX CHEFS" : L === "en" ? "Join AQX Chefs | ALQURMANI X" : "Únete a los chefs AQX | ALQURMANI X";
  ["display_name","country","spec","cui","bio","wcc","wn"].forEach(i => err(i,""));
  fillCountries(); renderTags("spec"); renderTags("cui"); if (!busy) $("send").textContent = t("send"); refresh();
  if (window.turnstile || !TURNSTILE_SITE_KEY) mountTS();
  try { localStorage.setItem("aqx_lang", L); } catch {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.l)));
$("homeLink").href = HOME_URL; $("blogLink").href = BLOG_URL;

/* ===== التمرير ===== */
const sp = $("sp"), tp = $("top");
addEventListener("scroll", () => { const m = document.documentElement.scrollHeight - innerHeight; sp.style.transform = "scaleX(" + (m > 0 ? Math.min(1, scrollY/m) : 0) + ")"; tp.classList.toggle("show", scrollY > 300); }, {passive:true});
tp.addEventListener("click", () => scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"}));
if ("IntersectionObserver" in window) { const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12}); document.querySelectorAll(".rv").forEach(e => io.observe(e)); }
else document.querySelectorAll(".rv").forEach(e => e.classList.add("in"));

/* ===== النوافذ ===== */
function modal({kind, title, text, id, warn, buttons}) {
  $("dseal").className = "seal " + kind; $("dico").setAttribute("href", kind === "ok" ? "#ok" : kind === "warn" ? "#al" : "#x");
  const ic = $("dseal").firstElementChild; ic.replaceWith(ic.cloneNode(true));
  $("dt").textContent = title; $("dp").textContent = text; $("rec").hidden = !id; $("dwarn").hidden = !warn; if (id) $("r-id").textContent = id;
  const box = $("dacts"); box.textContent = "";
  buttons.forEach(b => { const el = document.createElement("button"); el.type = "button"; el.className = "btn " + (b.cls || "gh"); el.textContent = b.label; el.addEventListener("click", b.fn); box.append(el); });
  if (!$("dlg").open) $("dlg").showModal();
}
const closeM = () => $("dlg").close();
const simple = (kind, tk, dk, bk, extra) => modal({kind, title:t(tk), text:t(dk) + (extra ? " (" + extra + ")" : ""), buttons:[{label:t(bk||"ok"), cls:"pri", fn:closeM}]});
async function copyText(txt, btn) { try { await navigator.clipboard.writeText(txt); btn.textContent = t("copied"); } catch { const r = document.createRange(); r.selectNodeContents($("r-id")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = t("manual"); } }

/* ===== الإرسال إلى المحرك ===== */
async function post(payload) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), signal:ctl.signal});
    const txt = await res.text(); let data;
    try { data = JSON.parse(txt); } catch { return {kind:"parse"}; }
    return data && typeof data === "object" && typeof data.ok === "boolean" ? {kind:"ok", data} : {kind:"parse"};
  } catch (e) { return {kind: e && e.name === "AbortError" ? "timeout" : "net"}; } finally { clearTimeout(tm); }
}
function validate() {
  const name = $("display_name").value.trim(), bio = $("bio").value.trim(), cons = $("consent").checked;
  const wcc = toLatin($("wcc").value.trim()), wn = toLatin($("wn").value).replace(/[\s\-()]/g,"");
  const sv = listVal("spec"), cv = listVal("cui");
  const rs = [["display_name", name.length >= 2 && name.length <= 60, t("eName")], ["country", !!$("country").value, t("eCountry")],
    ["spec", sel.spec.items.length > 0 && sv.length <= 200, t("eSpec")], ["cui", sel.cui.items.length > 0 && cv.length <= 200, t("eCui")], ["bio", bio.length >= 10 && bio.length <= 600, t("eBio")]];
  if (cons) rs.push(["wcc", /^\+[1-9]\d{0,3}$/.test(wcc), t("eWcc")], ["wn", /^\d{6,15}$/.test(wn), t("eWn")]);
  let first = null; rs.forEach(([id, ok, m]) => { err(id, ok ? "" : m); if (!ok && !first) first = id; });
  if (first) { const f = $(first) || $(first+"-i"); if (f) f.focus(); }
  return first ? null : {name, bio, cons, wcc, wn, sv, cv};
}
$("form").addEventListener("submit", async ev => {
  ev.preventDefault(); if (busy) return;
  if ($("website").value) return;
  $("form-s").textContent = "";
  if (!TURNSTILE_SITE_KEY) return err("ts", t("tsSetup"));
  const now = Date.now(); tries = tries.filter(x => now - x < WINDOW_MS);
  if (tries.length >= MAX_TRIES) return ($("form-s").textContent = t("many"));
  const v = validate(); if (!v) return;
  if (now - t0 < MIN_FILL_MS) return ($("form-s").textContent = t("fast"));
  if (!tsToken) return err("ts", t("eTs"));
  tries.push(now); busy = true;
  const btn = $("send"); btn.disabled = true; btn.textContent = ""; const sp2 = document.createElement("span"); sp2.className = "spin"; btn.append(sp2, document.createTextNode(" " + t("sending")));
  const payload = {turnstile_token:tsToken, display_name:v.name, country_code:$("country").value, country_name:$("country").selectedOptions[0].textContent,
    specialties:v.sv, cuisines:v.cv, bio:v.bio, whatsapp_country_code:v.cons ? v.wcc : "", whatsapp_number:v.cons ? v.wn : "", contact_consent:v.cons};
  const r = await post(payload);
  busy = false; btn.disabled = false; btn.textContent = t("send"); tsToken = ""; mountTS();   /* الرمز يُستخدم مرة واحدة */
  if (r.kind !== "ok") return simple("warn","uncT","uncD");
  const d = r.data;
  if (d.ok === true) {
    const id = d.application_id != null ? String(d.application_id) : "";
    const b = [];
    if (id) b.push({label:t("copy"), cls:"pri", fn:e => copyText(id, e.currentTarget)});
    if (/^https:\/\//.test(SUCCESS_URL)) b.push({label:t("cont"), cls:"gold", fn:() => { location.href = SUCCESS_URL; }});
    b.push({label:t("toHome"), fn:() => { location.href = HOME_URL; }});
    $("form").reset(); sel.spec.items = []; sel.cui.items = []; $("wbox").hidden = true; $("cnt").textContent = "0 / 600"; renderTags("spec"); renderTags("cui"); refresh();
    return modal({kind:"ok", title:t("sucT"), text:t("sucD"), id, warn:true, buttons:b});
  }
  if (d.code === "DUPLICATE_NAME") { err("display_name", t("dupD")); $("display_name").focus(); return simple("bad","dupT","dupD","change"); }
  const msg = L === "ar" && typeof d.message === "string" && d.message.length < 160 ? d.message : t("rejD");
  modal({kind:"bad", title:t("rejT"), text:msg + (d.code ? " (" + String(d.code).slice(0,40) + ")" : ""), buttons:[{label:t("rev"), cls:"pri", fn:closeM}]});
});

let start = ""; try { start = localStorage.getItem("aqx_lang") || ""; } catch {}
if (!T[start]) { const n = (navigator.language || "ar").slice(0,2).toLowerCase(); start = T[n] ? n : "ar"; }
applyLang(start); loadTS();
</script>
</body>
</html>
