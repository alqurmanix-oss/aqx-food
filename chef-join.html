const $ = id => document.getElementById(id);
let L = "ar";
const t = (k, o) => { let s = (T[L][k] ?? T.ar[k] ?? ""); if (o) for (const x in o) s = s.replace("{"+x+"}", o[x]); return s; };
function applyLang(l) {
  L = T[l] ? l : "ar";
  document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach(e => { e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === L)));
  document.title = t("title"); $("top").setAttribute("aria-label", t("top"));
  ["name","phone","wa","handle"].forEach(i => err(i,"")); $("handle-s").textContent = ""; $("handle-s").className = "st";
  if (!busy) $("send").textContent = t("send");
  progress(); suggest();
  try { localStorage.setItem("aqx_lang", L); } catch {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.l)));

const t0 = Date.now(); let busy = false, tries = [], check = {handle:"",status:""};
$("homeLink").href = HOME_URL; $("blogLink").href = BLOG_URL;
const toLatin = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function err(id, m) { const e = $(id+"-e"), i = $(id); e.textContent = m || ""; if (m) i.setAttribute("aria-invalid","true"); else i.removeAttribute("aria-invalid"); return !m; }
const normHandle = v => { v = v.trim().toLowerCase(); return v && v[0] !== "@" ? "@"+v : v; };
const validPhone = v => /^\+?[0-9\s\-()]{8,20}$/.test(v) && (v.match(/\d/g)||[]).length >= 8;
const validHandle = v => /^@[a-z0-9_]{2,29}$/.test(v);
const NS = "http://www.w3.org/2000/svg";
function setSt(id, cls, txt, icon) {
  const el = $(id); el.className = "st " + cls; el.textContent = "";
  if (cls === "load") { const s = document.createElement("span"); s.className = "spin"; el.append(s); }
  else if (icon) { const s = document.createElementNS(NS,"svg"); s.setAttribute("class","i"); const u = document.createElementNS(NS,"use"); u.setAttribute("href","#"+icon); s.append(u); el.append(s); }
  el.append(document.createTextNode(txt));
}

/* ===== الاتصال بالمحرك (text/plain لتفادي preflight) ===== */
async function api(payload) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), signal:ctl.signal});
    const txt = await res.text(); let data;
    try { data = JSON.parse(txt); } catch { return {kind:"parse"}; }
    return {kind:"ok", data};
  } catch (e) { return {kind: e && e.name === "AbortError" ? "timeout" : "net"}; }
  finally { clearTimeout(tm); }
}

/* ===== فحص اسم الشهرة ===== */
async function checkHandle() {
  const h = normHandle($("handle").value); $("handle").value = h; err("handle","");
  if (!validHandle(h)) { setSt("handle-s","bad",t("sFmt"),"x"); check = {handle:"",status:""}; return "invalid"; }
  setSt("handle-s","load",t("sLoad")); $("chk").disabled = true;
  const r = await api({action:"check_name", publicHandle:h}); $("chk").disabled = false;
  const d = r.kind === "ok" && r.data && typeof r.data === "object" ? r.data : null;
  if (d && d.exists === true) { setSt("handle-s","bad",t("sTaken"),"x"); check = {handle:h,status:"taken"}; progress(); return "taken"; }
  if (d && d.ok === true && d.exists === false) { setSt("handle-s","ok",t("sFree"),"ok"); check = {handle:h,status:"free"}; progress(); return "free"; }
  setSt("handle-s","warn",t("sFail"),"al"); check = {handle:"",status:""}; return "fail";
}
$("chk").addEventListener("click", checkHandle);
$("handle").addEventListener("input", () => { const h = normHandle($("handle").value); if (h !== check.handle) { check = {handle:"",status:""}; $("handle-s").className = "st"; $("handle-s").textContent = ""; } err("handle",""); });

/* ===== أفكار: اقتراح أسماء شهرة + مؤشرات التقدم ===== */
function suggest() {
  const box = $("chips"); box.textContent = "";
  const base = (toLatin($("name").value).toLowerCase().normalize("NFD").replace(/[^a-z0-9 ]/g,"").trim().split(/\s+/)[0] || "chef").slice(0,12);
  const r = () => Math.floor(100 + Math.random()*900);
  [`@chef_${base}`, `@${base}_kitchen`, `@${base}${r()}`].forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.addEventListener("click", () => { $("handle").value = s; checkHandle(); }); box.append(b); });
}
function progress() {
  const n = [$("name").value.trim().length >= 3, validPhone(toLatin($("phone").value.trim())), validPhone(toLatin($("wa").value.trim())), validHandle(normHandle($("handle").value))].filter(Boolean).length;
  $("bar").style.width = n*25 + "%"; $("meterT").textContent = t("meter",{n});
}
$("form").addEventListener("input", progress);
$("name").addEventListener("change", suggest);
$("bio").addEventListener("input", () => { $("cnt").textContent = $("bio").value.length + " / 500"; });
$("same").addEventListener("change", e => { if (e.target.checked) { $("wa").value = $("phone").value; progress(); } });
$("phone").addEventListener("input", () => { if ($("same").checked) $("wa").value = $("phone").value; });
const sp = $("prog"), tp = $("top");
addEventListener("scroll", () => { const m = document.documentElement.scrollHeight - innerHeight; sp.style.transform = "scaleX(" + (m > 0 ? Math.min(1, scrollY/m) : 0) + ")"; tp.classList.toggle("show", scrollY > 300); }, {passive:true});
tp.addEventListener("click", () => scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"}));

/* ===== النوافذ المنبثقة ===== */
function modal({kind="ok", title, text, record, warn, buttons}) {
  $("dseal").className = "seal " + (kind === "ok" ? "" : kind);
  $("dico").setAttribute("href", kind === "ok" ? "#ok" : kind === "warn" ? "#al" : "#x");
  $("dt").textContent = title; $("dp").textContent = text;
  $("rec").hidden = !record; $("dwarn").hidden = !warn;
  if (record) { $("r-h").textContent = record.handle; $("r-id").textContent = record.id; }
  const box = $("dacts"); box.textContent = "";
  buttons.forEach(b => { const el = document.createElement("button"); el.type = "button"; el.className = "btn " + (b.cls||"gh"); el.textContent = b.label; el.addEventListener("click", b.fn); box.append(el); });
  if (!$("dlg").open) $("dlg").showModal();
}
const closeM = () => $("dlg").close();
async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); btn.textContent = t("copied"); }
  catch { const r = document.createRange(); r.selectNodeContents($("r-id")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = t("manual"); }
}
const simple = (kind, tk, dk, bk) => modal({kind, title:t(tk), text:t(dk), buttons:[{label:t(bk||"close"), cls:"pri", fn:closeM}]});

/* ===== التحقق والإرسال ===== */
function validate() {
  const name = $("name").value.trim(), phone = toLatin($("phone").value.trim()), wa = toLatin($("wa").value.trim()), h = normHandle($("handle").value);
  $("handle").value = h;
  const res = [["name", name.length >= 3 && name.length <= 100, t("eName")], ["phone", validPhone(phone), t("ePhone")], ["wa", validPhone(wa), t("eWa")], ["handle", validHandle(h), t("sFmt")]];
  let first = null;
  res.forEach(([id, ok, m]) => { err(id, ok ? "" : m); if (!ok && !first) first = id; });
  if (first) $(first).focus();
  return !first;
}
$("form").addEventListener("submit", async ev => {
  ev.preventDefault(); if (busy) return;
  if ($("website").value) return;
  const now = Date.now(); tries = tries.filter(x => now - x < WINDOW_MS);
  if (tries.length >= MAX_TRIES) return setSt("form-s","warn",t("many"),"al");
  if (now - t0 < MIN_FILL_MS) return setSt("form-s","warn",t("review"),"al");
  $("form-s").textContent = "";
  if (!validate()) return;
  tries.push(now); busy = true;
  const btn = $("send"); btn.disabled = true; btn.textContent = "";
  const s = document.createElement("span"); s.className = "spin"; btn.append(s, document.createTextNode(" " + t("sending")));
  const reset = () => { busy = false; btn.disabled = false; btn.textContent = t("send"); };
  try {
    const h = $("handle").value;
    if (check.handle !== h || check.status !== "free") {
      const st = await checkHandle();
      if (st !== "free") { if (st === "fail") setSt("form-s","warn",t("hFail"),"al"); $("handle").focus(); return reset(); }
    }
    const r = await api({action:"submit", applicantName:$("name").value.trim(), phone:toLatin($("phone").value.trim()), whatsapp:toLatin($("wa").value.trim()), publicHandle:h,
      country:$("country").value.trim(), city:$("city").value.trim(), specialty:$("specialty").value.trim(), bio:$("bio").value.trim(), hp:"", elapsedMs:Date.now()-t0, lang:L});
    reset();
    if (r.kind === "timeout") return simple("warn","toT","toD","ok");
    if (r.kind === "net") return simple("bad","netT","netD");
    if (r.kind === "parse") return simple("warn","parT","parD");
    const d = r.data || {};
    if (d.exists === true) { check = {handle:h,status:"taken"}; setSt("handle-s","bad",t("sTaken"),"x"); $("handle").focus(); return simple("bad","takT","takD","chg"); }
    if (d.ok !== true) return simple("bad","rejT","rejD","rev");
    const id = String(d.applicationId || ""), hh = String(d.publicHandle || h);
    $("form").reset(); $("cnt").textContent = "0 / 500"; check = {handle:"",status:""}; $("handle-s").textContent = ""; progress(); suggest();
    modal({title:t("sucT"), text:t("sucD"), record:{handle:hh, id:id||"—"}, warn:true,
      buttons:[{label:t("copy"), cls:"pri", fn:e => copyText(id, e.currentTarget)}, {label:t("toHome"), fn:() => { location.href = HOME_URL; }}]});
  } catch { reset(); simple("bad","errT","errD"); }
});

let start = "ar";
try { start = localStorage.getItem("aqx_lang") || ""; } catch {}
if (!T[start]) { const n = (navigator.language || "ar").slice(0,2).toLowerCase(); start = T[n] ? n : "ar"; }
applyLang(start);
</script>
