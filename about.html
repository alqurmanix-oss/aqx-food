.br b{display:block;font:900 19px/1.1 Cairo;color:var(--teal2)}.br small{font-weight:700;font-size:12px;color:var(--gold)}.ac{display:flex;gap:8px;margin-inline-start:auto}
.ib{height:44px;min-width:44px;padding:0 13px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 15px Tajawal;cursor:pointer;color:var(--ink);transition:.25s}.ib:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--gold)}
.hero{position:relative;margin:26px auto 0;max-width:1180px;border-radius:34px;overflow:hidden;padding:70px 34px 60px;text-align:center;color:#fff;background:radial-gradient(600px 300px at 80% 0,rgba(242,217,139,.35),transparent 60%),linear-gradient(135deg,#064E57,#087380 60%,#0E9AA7);box-shadow:0 40px 90px -30px rgba(6,78,87,.7);border:1.5px solid rgba(242,217,139,.6)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px)}.hero>*{position:relative}
.sh{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:40px;background:var(--gg);box-shadow:0 14px 40px rgba(201,150,46,.55);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.hero h1{font:900 clamp(34px,6vw,64px)/1.2 Cairo}.hero h1 span{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{opacity:.92;margin-top:10px;font-size:18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}.chip{padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(242,217,139,.6);font-weight:700;font-size:14px;backdrop-filter:blur(8px)}
.lay{display:grid;grid-template-columns:290px 1fr;gap:28px;margin:34px auto;align-items:start}
aside{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(14px)}aside h4{font-size:16px;color:var(--gold);margin-bottom:8px}
aside a{display:block;padding:6px 11px;border-radius:11px;font-size:13.5px;color:var(--mut);line-height:1.6;transition:.2s}aside a:hover,aside a.on{background:var(--tg);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 30px;margin-bottom:18px;box-shadow:var(--sh);backdrop-filter:blur(12px);position:relative;transition:.3s;opacity:0;transform:translateY(24px)}.sec.v{opacity:1;transform:none}.sec:hover{border-color:var(--gold)}.sec.sp{outline:3px solid var(--gold2);box-shadow:0 0 0 8px rgba(242,217,139,.25)}
.sec:before{content:"";position:absolute;inset-block:22px;inset-inline-start:0;width:5px;border-radius:5px;background:var(--gg)}
.sec h2{font:900 clamp(19px,2.6vw,25px)/1.5 Cairo;color:var(--teal2);margin-bottom:10px}:root[data-t=d] .sec h2{color:#5fe0ec}.sec p{margin:6px 0;color:var(--ink)}.sec ul{list-style:none;margin:8px 0;padding:0}
.sec li{position:relative;padding:3px 26px 3px 0;color:var(--ink)}[dir=ltr] .sec li{padding:3px 0 3px 26px}.sec li:before{content:"◆";position:absolute;inset-inline-start:0;color:var(--gold);font-size:11px;top:9px}.sec li.ck:before{content:"✓";font-size:15px;top:3px;font-weight:900;color:var(--teal)}
.sec h4{color:var(--gold);margin-top:12px;font-size:15px}.sec a.l{color:var(--teal2);font-weight:700;border-bottom:2px solid var(--gold2)}.legal{border:1.5px solid var(--gold);background:linear-gradient(135deg,rgba(242,217,139,.2),transparent)}
.end{margin:30px auto 20px;border-radius:34px;padding:56px 28px;text-align:center;color:#fff;background:radial-gradient(500px 260px at 20% 0,rgba(242,217,139,.3),transparent 60%),linear-gradient(135deg,#064E57,#087380);border:1.5px solid rgba(242,217,139,.6);box-shadow:0 40px 90px -30px rgba(6,78,87,.7)}
.end .orn{font-size:26px;letter-spacing:10px;color:var(--gold2)}.end h3{font:900 clamp(26px,4vw,40px)/1.4 Cairo;margin:10px 0}.end .mt{font:900 clamp(30px,5vw,52px) Cairo;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0}.end p{opacity:.9;max-width:680px;margin:auto}
footer{text-align:center;padding:22px 0 40px;color:var(--mut);font-size:14px}

var AR=[["", "أهلًا بك في AQX Food | مطبخ القرماني إكس 🍽️\nمن هنا تبدأ حكاية مختلفة مع الطعام.\nAQX Food هي منصة رقمية متخصصة في عالم الطعام والطبخ، أطلقت ضمن منظومة ALQURMANI X | AQX بهدف تقديم تجربة تجمع بين الوصفات، المعرفة، الأدوات الذكية، الحسابات، الأفكار، الاكتشاف، والتقنية في مكان واحد.\nنحن لا نريد أن تكون AQX Food مجرد موقع يحتوي على وصفات.\nنريدها أن تكون مطبخًا رقميًا متكاملًا يساعدك قبل الطبخ، وأثناءه، وبعده."], ["من نحن؟", "AQX Food | مطبخ القرماني إكس هي إحدى مشاريع منظومة ALQURMANI X.\nالمنصة تجمع بين المحتوى الغذائي والطهي وبين الأدوات الرقمية الحديثة، بحيث يستطيع المستخدم الوصول إلى الوصفة والمعلومة والأداة التي يحتاجها من مكان واحد.\nنؤمن أن المطبخ لم يعد مجرد مكان لإعداد الطعام.\nالمطبخ اليوم يمكن أن يكون:\n• إبداعًا + معرفة + اقتصادًا + تقنية + تجربة.\nولهذا نحاول بناء AQX Food بطريقة مختلفة عن مواقع الوصفات التقليدية."], ["ماذا نقدم؟", "تقدم AQX Food مجموعة من المحتويات والأدوات التي تساعد المستخدم في رحلته داخل المطبخ.\nومن أمثلة ذلك:\n• 🍳 وصفات الطعام.\n• 🥘 وصفات منزلية وتقليدية.\n• 🍝 وصفات عالمية.\n• 🥗 أفكار للأكل والتغذية.\n• 🍰 الحلويات والمخبوزات.\n• 🥤 المشروبات.\n• 🍽️ أفكار للوجبات والسفرات.\n• 📋 تنظيم المقادير.\n• ⚖️ تحويل وحدات القياس.\n• 👨‍👩‍👧‍👦 حساب الحصص.\n• 🔥 أدوات مرتبطة بالطبخ.\n• 🧮 حسابات السعرات والتكلفة.\n• 💡 أفكار وحيل المطبخ.\n• 🛒 أفكار ومعلومات عن المنتجات والأدوات.\n• 🔎 البحث واكتشاف الوصفات.\n• 🤖 أدوات ذكية وتقنيات تعتمد على البرمجة والذكاء الاصطناعي عند توفرها.\nوقد يتم تطوير وإضافة أقسام وخدمات جديدة باستمرار."], ["AQX Food ليست مجرد وصفات", "لدينا رؤية أكبر من مجرد نشر وصفة.\nعندما تبحث عن وصفة، قد تحتاج إلى معرفة:\n• ما هي المكونات؟\n• ما الكمية المناسبة؟\n• كم عدد الأشخاص؟\n• كم تبلغ التكلفة؟\n• كم تستغرق الوصفة؟\n• ما البدائل الممكنة؟\n• كم تحتوي تقريبًا من السعرات؟\n• ما الأداة المناسبة؟\n• كيف يمكن تعديل الكمية؟\n• كيف يمكن حفظ الطعام؟\n• وغير ذلك.\nلذلك نسعى إلى تحويل الوصفة من مجرد صفحة نصية إلى تجربة تفاعلية متكاملة."], ["مطبخ يجمع البيت والتقنية", "نحن نؤمن أن التكنولوجيا لا يجب أن تبعدنا عن المطبخ.\nبل يمكنها أن تجعل المطبخ أسهل.\nولهذا تعمل AQX Food على دمج التقنية مع الطبخ من خلال الأدوات الرقمية والحسابات والواجهات التفاعلية وقواعد البيانات والخدمات الذكية.\nهدفنا هو أن يصبح استخدام التكنولوجيا في المطبخ شيئًا طبيعيًا وسهلًا."], ["الوصفة عندنا لها قصة", "نحن لا ننظر إلى الطعام على أنه مجرد قائمة مكونات.\nوراء كل طبق قصة.\nقد تكون:\n• ذكرى من البيت.\n• أكلة من الطفولة.\n• وصفة من الأم.\n• طبقًا من الجدة.\n• أكلة شعبية من مدينة أو قرية.\n• تجربة جديدة.\n• أو وصفة ابتكرها شخص في مطبخه.\nلذلك نهتم بالمطبخ المنزلي والتراث الغذائي بقدر اهتمامنا بالوصفات الحديثة."], ["من المطبخ المصري إلى العالم", "نحن ننطلق من مصر، ونؤمن أن المطبخ المصري والعربي يمتلكان ثروة هائلة من الأكلات والوصفات والتقاليد الغذائية التي تستحق أن تصل إلى العالم.\nوفي الوقت نفسه، لا نغلق الباب أمام المطابخ العالمية.\nAQX Food تسعى إلى تقديم تجربة مفتوحة على:\n• 🇪🇬 المطبخ المصري.\n• 🌍 المطبخ العربي.\n• 🌎 المطابخ العالمية.\n• 🥘 الأكلات الشعبية.\n• 🍝 الأكلات الحديثة.\n• 🥗 الوصفات الصحية.\n• 🍰 الحلويات.\n• ☕ المشروبات.\nوغيرها من مدارس ومطابخ الطعام."], ["تعدد اللغات", "نحن نعمل على جعل محتوى AQX Food قابلًا للوصول إلى جمهور من دول مختلفة.\nولهذا يمكن أن يتوسع المحتوى مستقبلًا إلى لغات متعددة.\nهدفنا ليس فقط ترجمة الكلمات.\nبل تقديم تجربة مفهومة وقابلة للاستخدام للمستخدم من أي مكان."], ["أدوات AQX Food", "من أهم أفكار المنصة بناء مجموعة من الأدوات التي تجعل الموقع عمليًا، وليس مجرد مكتبة مقالات.\nقد تشمل هذه الأدوات:\n### حاسبة المقادير\nلتعديل كميات المكونات حسب عدد الأشخاص.\n### حاسبة الحصص\nلمعرفة الكمية المناسبة لعدد مختلف من الأشخاص.\n### حاسبة السعرات\nللحصول على تقديرات تقريبية للسعرات وفق البيانات المتاحة.\n### حاسبة تكلفة الوصفة\nلمساعدة المستخدم على تقدير تكلفة إعداد الطبق.\n### محولات القياس\nلتحويل الوحدات والمقادير المختلفة.\n### أدوات المطبخ الذكية\nلمساعدة المستخدم في الحساب والتنظيم والاختيار.\nوقد تتطور هذه الأدوات إلى منظومة أكبر مع الوقت."], ["AQX Kitchen Lab", "ضمن رؤية AQX Food، يمكن أن تعمل الأدوات الرقمية تحت مفهوم: AQX Kitchen Lab\nأي مختبر رقمي للمطبخ.\nالفكرة هي توفير أدوات ذكية تساعد المستخدم على:\n• الحساب.\n• التحويل.\n• المقارنة.\n• التخطيط.\n• تنظيم الوصفات.\n• تقدير التكلفة.\n• حساب الكميات.\n• فهم المكونات.\nليصبح المطبخ أكثر تنظيمًا وأقل عشوائية."], ["الطعام والاقتصاد", "نحن نعرف أن الطبخ ليس مجرد هواية.\nبالنسبة لكثير من الأسر، الطعام جزء أساسي من الميزانية اليومية.\nلذلك نهتم بفكرة: \"اطبخ بشكل أفضل، وأنفق بذكاء.\"\nومن هنا تأتي أهمية أدوات التكلفة والحصص والمقادير.\nفالهدف ليس فقط أن تعرف كيف تطبخ.\nبل أن تعرف أيضًا:\n• ماذا تطبخ؟\n• ولكم شخصًا؟\n• وبأي كمية؟\n• وبأي تكلفة تقريبية؟"], ["الطعام للجميع", "AQX Food مصممة لتكون مناسبة لأكبر عدد ممكن من المستخدمين.\nسواء كنت:\n• 👩‍🍳 تطبخ يوميًا.\n• 👨‍🍳 مبتدئًا في المطبخ.\n• 🏠 تطبخ لعائلتك.\n• 🎓 تتعلم الطبخ.\n• 💼 تعمل في مجال الطعام.\n• 🧑‍🍳 صاحب مشروع أطعمة.\n• 🍰 مهتمًا بالحلويات.\n• 🥗 مهتمًا بالتغذية.\n• 🌍 تحب تجربة مطابخ مختلفة.\nيمكنك العثور على محتوى أو أدوات تناسب احتياجك."], ["رؤيتنا", "رؤيتنا هي بناء واحدة من المنصات العربية الحديثة في مجال الطعام، بحيث تجمع بين:\n• المحتوى + الأدوات + التقنية + البيانات + تجربة المستخدم.\nنريد أن تكون AQX Food مكانًا يعود إليه المستخدم ليس فقط عندما يريد وصفة، ولكن عندما يحتاج أي شيء متعلق برحلته في المطبخ."], ["مهمتنا", "مهمتنا بسيطة: أن نجعل تجربة الطبخ أسهل، أذكى، وأمتع.\nنريد أن نساعد المستخدم على الانتقال من:\n• \"ماذا أطبخ؟\"\nإلى:\n• \"وجدت الوصفة.\"\nثم:\n• \"عرفت المقادير.\"\nثم:\n• \"حسبت الكمية.\"\nثم:\n• \"عرفت التكلفة.\"\nثم:\n• \"بدأت الطبخ.\"\nثم:\n• \"استمتعت بالنتيجة.\""], ["الجودة قبل الكثرة", "لا نريد أن تكون AQX Food مجرد موقع يحتوي على آلاف الصفحات بلا قيمة.\nنحن نركز على تقديم محتوى يمكن أن يكون مفيدًا وقابلًا للاستخدام.\nونعمل على تطوير المحتوى والأدوات تدريجيًا، مع الاهتمام بالتجربة وسهولة الاستخدام."], ["التقنية في خدمة الإنسان", "التكنولوجيا بالنسبة لنا ليست الهدف.\nالتكنولوجيا وسيلة.\nإذا كانت أداة تقنية تجعل المستخدم يحتاج إلى عشر خطوات بدل خطوة واحدة، فهذه ليست تجربة جيدة.\nلذلك نسعى إلى بناء أدوات:\n• بسيطة في الاستخدام، قوية في النتيجة."], ["الذكاء الاصطناعي", "مع تطور AQX Food، يمكن استخدام تقنيات الذكاء الاصطناعي في بعض الأدوات والخدمات.\nمثل:\n• اقتراح الوصفات.\n• تحليل المكونات.\n• اقتراح البدائل.\n• تنظيم الوصفات.\n• المساعدة في التخطيط للوجبات.\n• البحث الذكي.\n• تصنيف المحتوى.\n• أدوات المطبخ الذكية.\nلكننا نؤكد أن الذكاء الاصطناعي أداة مساعدة، وليس بديلًا عن الخبرة البشرية أو المختصين، خصوصًا في المسائل الطبية أو الغذائية الحساسة."], ["مجتمع حول الطعام", "نحن نطمح إلى بناء مجتمع يهتم بالطعام وليس مجرد زوار عابرين.\nمجتمع يشارك:\n• الوصفات.\n• الأفكار.\n• التجارب.\n• النصائح.\n• الأكلات المحلية.\n• الابتكارات المنزلية.\n• والقصص المرتبطة بالطعام."], ["احترام التراث", "من أهم أهداف AQX Food الحفاظ على قيمة الأكلات والوصفات التي تنتقل من جيل إلى جيل.\nهناك أكلات بسيطة جدًا، لكنها تحمل ذاكرة كاملة لعائلة أو مدينة أو قرية.\nنحن نؤمن أن توثيق هذه الوصفات هو نوع من الحفاظ على جزء من الثقافة."], ["من مصر إلى العالم", "بدأت الفكرة من مصر.\nوتحمل AQX Food هوية عربية ومصرية، لكنها تنظر إلى العالم باعتباره جمهورًا محتملًا.\nهدفنا أن تصل الوصفة المصرية إلى شخص في دولة أخرى، وأن تصل الوصفة العالمية إلى المطبخ المصري.\nالمطبخ لغة عالمية."], ["AQX Food ومنظومة ALQURMANI X", "AQX Food ليست مشروعًا منفصلًا عن الرؤية الأكبر لـ ALQURMANI X | AQX.\nهي جزء من منظومة رقمية تسعى إلى إنشاء مجموعة من الخدمات والمنصات والأدوات التي تخدم المستخدم في مجالات متعددة.\nويتم تطوير كل مشروع بحسب وظيفته واحتياج مستخدميه.\nAQX Food متخصصة في عالم الطعام والمطبخ."], ["المؤسس", "تم تأسيس مشروع AQX تحت هوية:\n### محمد بسيوني (أبو عبدالله القرماني)\nمن:\n### مصر – محافظة أسوان\nوتحمل منظومة AQX رؤية تقوم على العمل والتجربة وبناء الخدمات الرقمية بصورة عملية."], ["فلسفتنا", "نؤمن بأن أفضل الأفكار ليست دائمًا الأكثر تعقيدًا.\nأحيانًا تكون الفكرة الأفضل هي أن تجعل شيئًا يستخدمه الناس يوميًا:\n• أسهل.\n• وأسرع.\n• وأوضح.\n• وأكثر فائدة.\nولهذا نحاول بناء AQX Food من منظور المستخدم أولًا."], ["ماذا بعد؟", "AQX Food مشروع قابل للنمو.\nومع تطور المنصة يمكن أن تظهر:\n• أدوات جديدة.\n• أقسام جديدة.\n• لغات جديدة.\n• وصفات جديدة.\n• قواعد بيانات غذائية.\n• أدوات ذكية.\n• خدمات للمطابخ.\n• خدمات لأصحاب مشاريع الطعام.\n• خصائص شخصية للمستخدم.\n• مزايا تفاعلية.\n• تكاملات مع خدمات أخرى داخل منظومة AQX.\nلكن الأساس سيظل واحدًا:\n### الطعام أولًا، والمستخدم أولًا."], ["شعارنا", "### AQX Food\n### مطبخ القرماني إكس\nنطبخ الفكرة قبل الطبق."], ["تواصل معنا", "للاستفسارات أو الاقتراحات أو التعاون أو الإبلاغ عن مشكلة، يمكنك استخدام وسائل التواصل الرسمية المنشورة على المنصة.\nالموقع الرسمي:\nhttps://food-aqx.alqurmanix.com/\nالمنصة:\nAQX Food | مطبخ القرماني إكس\nالمنظومة:\nALQURMANI X | AQX\nالمؤسس:\nمحمد بسيوني (أبو عبدالله القرماني)\nالدولة:\nمصر 🇪🇬 – أسوان\nالبريد الرسمي:\ncontact@alqurmanix.com"]];
var EN=[["", "Welcome to AQX Food | ALQURMANI X Kitchen 🍽️\nA different story with food starts here.\nAQX Food is a digital platform for food and cooking, launched within the ALQURMANI X | AQX ecosystem to bring recipes, knowledge, smart tools, calculations, ideas, discovery and technology together in one place.\nWe don't want AQX Food to be just a recipe site. We want it to be a complete digital kitchen that helps you before, during and after cooking."], ["Who we are", "AQX Food | ALQURMANI X Kitchen is a project of the ALQURMANI X ecosystem. It combines food and cooking content with modern digital tools, so users can reach the recipe, information and tool they need in one place.\nWe believe the kitchen is no longer just a place to prepare food. Today it can be:\n• Creativity + knowledge + economy + technology + experience.\nThat is why we build AQX Food differently from traditional recipe sites."], ["What we offer", "AQX Food offers content and tools that help users on their kitchen journey, for example:\n• 🍳 Recipes, 🥘 home and traditional recipes, 🍝 world recipes.\n• 🥗 Food and nutrition ideas, 🍰 desserts and baking, 🥤 drinks.\n• 🍽️ Meal and table ideas, 📋 ingredient organization.\n• ⚖️ Unit conversion, 👨‍👩‍👧‍👦 serving calculation, 🔥 cooking-related tools.\n• 🧮 Calorie and cost calculations, 💡 kitchen tips and tricks.\n• 🛒 Product and tool information, 🔎 recipe search and discovery.\n• 🤖 Smart tools using programming and AI where available.\nNew sections and services may be developed and added continuously."], ["AQX Food is not just recipes", "We have a bigger vision than publishing a recipe. When you look for a recipe you may need to know:\n• What are the ingredients? What quantity is right? How many people?\n• What is the cost? How long does it take? What substitutes are possible?\n• Roughly how many calories? Which tool fits? How can the quantity be adjusted?\n• How can the food be stored? And more.\nSo we aim to turn a recipe from a text page into a complete interactive experience."], ["A kitchen that joins home and technology", "We believe technology should not take us away from the kitchen; it can make the kitchen easier. AQX Food blends technology with cooking through digital tools, calculations, interactive interfaces, databases and smart services. Our goal is for technology in the kitchen to feel natural and easy."], ["Every recipe has a story", "We don't see food as a list of ingredients. Behind every dish there is a story. It may be:\n• A memory from home, a childhood dish, a mother's recipe, a grandmother's dish.\n• A folk dish from a city or village, a new experience, or a recipe someone invented in their kitchen.\nSo we care about home cooking and food heritage as much as modern recipes."], ["From the Egyptian kitchen to the world", "We start from Egypt and believe Egyptian and Arab cuisine hold a huge wealth of dishes, recipes and food traditions worth sharing with the world, while staying open to world cuisines:\n• 🇪🇬 Egyptian, 🌍 Arab and 🌎 world cuisines.\n• 🥘 Folk dishes, 🍝 modern dishes, 🥗 healthy recipes, 🍰 desserts, ☕ drinks.\nAnd other schools and kitchens of food."], ["Multiple languages", "We are working to make AQX Food content reachable to audiences in different countries, so content may expand to multiple languages in future. Our goal is not just translating words but giving a clear, usable experience from anywhere."], ["AQX Food tools", "A key idea is building tools that make the site practical, not just an article library. They may include:\n### Quantity calculator\nAdjust ingredient amounts by number of people.\n### Serving calculator\nFind the right amount for a different number of people.\n### Calorie calculator\nApproximate calorie estimates from available data.\n### Recipe cost calculator\nHelps estimate the cost of preparing a dish.\n### Measurement converters\nConvert different units and quantities.\n### Smart kitchen tools\nHelp with calculation, organization and choice.\nThese tools may grow into a larger system over time."], ["AQX Kitchen Lab", "Within AQX Food's vision, digital tools may operate under the concept of AQX Kitchen Lab, a digital laboratory for the kitchen. The idea is to provide smart tools for:\n• Calculating, converting, comparing and planning.\n• Organizing recipes, estimating cost, computing quantities and understanding ingredients.\nSo the kitchen becomes more organized and less random."], ["Food and economy", "Cooking is not just a hobby; for many families food is a core part of the daily budget. So we care about the idea: \"Cook better, spend smarter.\" That is why cost, serving and quantity tools matter. The goal is not only to know how to cook, but also:\n• What to cook? For how many people? In what quantity? At what approximate cost?"], ["Food for everyone", "AQX Food is designed for as many users as possible, whether you are:\n• 👩‍🍳 Cooking daily, 👨‍🍳 a beginner, 🏠 cooking for your family, 🎓 learning to cook.\n• 💼 Working in food, 🧑‍🍳 a food-business owner, 🍰 into desserts, 🥗 into nutrition, 🌍 keen on different cuisines.\nYou can find content or tools that fit your need."], ["Our vision", "To build one of the modern Arab food platforms, combining:\n• Content + tools + technology + data + user experience.\nWe want AQX Food to be where users return not only for a recipe, but for anything about their kitchen journey."], ["Our mission", "Simple: to make cooking easier, smarter and more enjoyable. We want to help users move from:\n• \"What do I cook?\" to \"I found the recipe,\" then \"I knew the ingredients,\" \"I calculated the quantity,\" \"I knew the cost,\" \"I started cooking,\" and \"I enjoyed the result.\""], ["Quality before quantity", "We don't want AQX Food to be thousands of valueless pages. We focus on content that is useful and usable, developing content and tools gradually with care for experience and ease of use."], ["Technology serving people", "Technology is not the goal; it is a means. If a tool makes users take ten steps instead of one, that is not a good experience. So we build tools that are:\n• Simple to use, strong in result."], ["Artificial intelligence", "As AQX Food evolves, AI may be used in some tools and services, such as:\n• Recipe suggestions, ingredient analysis, substitutes, recipe organization.\n• Meal-planning help, smart search, content classification, smart kitchen tools.\nWe stress that AI is an assisting tool, not a replacement for human expertise or specialists, especially in sensitive medical or nutrition matters."], ["A community around food", "We aspire to build a community that cares about food, not just passing visitors, one that shares:\n• Recipes, ideas, experiences, tips, local dishes, home innovations and food stories."], ["Respecting heritage", "A key goal is preserving the value of dishes and recipes passed from generation to generation. Some dishes are very simple yet carry the entire memory of a family, city or village. Documenting these recipes preserves part of our culture."], ["From Egypt to the world", "The idea began in Egypt. AQX Food carries an Arab and Egyptian identity but sees the world as a potential audience. We want an Egyptian recipe to reach someone in another country, and a world recipe to reach the Egyptian kitchen. The kitchen is a universal language."], ["AQX Food and the ALQURMANI X ecosystem", "AQX Food is not separate from the bigger vision of ALQURMANI X | AQX. It is part of a digital ecosystem building services, platforms and tools for users across many fields. Each project is developed by its function and its users' needs. AQX Food specializes in food and the kitchen."], ["The founder", "The AQX project was founded under the identity of:\n### Mohamed Bassiouny (Abu Abdullah Al-Qurmani)\nFrom:\n### Egypt – Aswan Governorate\nThe AQX ecosystem carries a vision built on work, experimentation and building digital services in a practical way."], ["Our philosophy", "The best ideas are not always the most complex. Sometimes the best idea is making something people use daily:\n• Easier, faster, clearer and more useful.\nSo we build AQX Food from the user's perspective first."], ["What's next?", "AQX Food is a project built to grow. As it evolves, we may see:\n• New tools, sections, languages and recipes.\n• Food databases, smart tools, services for kitchens and food-business owners.\n• Personal user features, interactive features, and integrations with other AQX services.\nBut the foundation stays the same:\n### Food first, user first."], ["Our slogan", "### AQX Food\n### ALQURMANI X Kitchen\nWe cook the idea before the dish."], ["Contact us", "For inquiries, suggestions, collaboration or reporting a problem, use the official channels published on the platform.\nOfficial website:\nhttps://food-aqx.alqurmanix.com/\nPlatform:\nAQX Food | ALQURMANI X Kitchen\nEcosystem:\nALQURMANI X | AQX\nFounder:\nMohamed Bassiouny (Abu Abdullah Al-Qurmani)\nCountry:\nEgypt 🇪🇬 – Aswan\nOfficial email:\ncontact@alqurmanix.com"]];
