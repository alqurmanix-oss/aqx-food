name: AQX Food AQX-authored content sync

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/aqx_food_content_sync.py"
      - ".github/scripts/aqx_food_recipe_parser.py"
      - ".github/scripts/test_aqx_food_recipe_parser.py"
      - ".github/workflows/aqx-food-aqx-content-sync.yml"
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: aqx-food-content-sync
  cancel-in-progress: false

jobs:
  sync-aqx-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sync script syntax
        run: |
          python -m py_compile .github/scripts/aqx_food_content_sync.py .github/scripts/aqx_food_recipe_parser.py .github/scripts/test_aqx_food_recipe_parser.py
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Sync AQX Blogger source into private staging
        env:
          AQX_FOOD_CONTENT_SYNC_URL: https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-github-content-sync
        run: |
          for attempt in 1 2 3; do
            echo "AQX content sync attempt ${attempt}/3"
            if python .github/scripts/aqx_food_content_sync.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Sync attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "AQX content sync failed after 3 attempts."
          exit 1

      - name: Create or update failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_number=$(gh issue list --state open --search "AQX Food content sync failure in:title" --json number --jq '.[0].number // empty')
          body="AQX Food automatic content pipeline failed.\n\nRun: ${RUN_URL}\nCommit: ${GITHUB_SHA}\n\nThe pipeline will retry automatically on its next scheduled run. Investigate this run before closing the alert."
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "AQX Food content sync failure" --body "$body"
          fi
