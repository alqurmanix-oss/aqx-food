name: AQX Food AQX-authored content sync

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aqx-food-content-sync
  cancel-in-progress: false

jobs:
  sync-aqx-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sync script syntax
        run: python -m py_compile .github/scripts/aqx_food_content_sync.py

      - name: Sync AQX Blogger source into private staging
        env:
          AQX_FOOD_CONTENT_SYNC_URL: https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-github-content-sync
        run: python .github/scripts/aqx_food_content_sync.py
