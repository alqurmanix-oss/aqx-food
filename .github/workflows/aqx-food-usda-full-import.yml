name: AQX Food guarded automatic USDA release import

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/usda_guarded_full_import.py"
      - ".github/workflows/aqx-food-usda-full-import.yml"
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: aqx-food-guarded-full-import
  cancel-in-progress: false

jobs:
  import-usda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests ijson

      - name: Validate importer syntax
        run: python -m py_compile .github/scripts/usda_guarded_full_import.py

      - name: Run guarded USDA release import with bounded retries
        id: usda-import
        env:
          AQX_FOOD_FULL_IMPORT_URL: https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-github-full-import
        run: |
          for attempt in 1 2 3; do
            echo "USDA release import attempt ${attempt}/3"
            if python .github/scripts/usda_guarded_full_import.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 45))
              echo "Import attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "USDA release import failed after 3 attempts."
          exit 1

      - name: Create or update critical source quality alert
        if: ${{ steps['usda-import'].outputs.critical_issues != '' && steps['usda-import'].outputs.critical_issues != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CRITICAL_ISSUES: ${{ steps['usda-import'].outputs.critical_issues }}
          WARNING_ISSUES: ${{ steps['usda-import'].outputs.warning_issues }}
        run: |
          issue_number=$(gh issue list --state open --search "AQX Food critical source data quality findings in:title" --json number --jq '.[0].number // empty')
          body=$(printf 'AQX Food source-data QA found %s critical and %s warning issues.\n\nRun: %s\n\nAffected source rows remain in private staging. No nutrition values were corrected, deleted, or promoted to live records automatically.' "$CRITICAL_ISSUES" "$WARNING_ISSUES" "$RUN_URL")
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body "$body"
            gh issue comment "$issue_number" --body "Automated source quality audit refreshed the findings."
          else
            gh issue create --title "AQX Food critical source data quality findings" --body "$body"
          fi

      - name: Close resolved source quality alert
        if: ${{ success() && steps['usda-import'].outputs.critical_issues == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list --state open --search "AQX Food critical source data quality findings in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "AQX Food source-data QA reports zero critical issues in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The quality alert is resolved."
            gh issue close "$issue_number"
          fi

      - name: Create or update USDA import failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue_number=$(gh issue list --state open --search "AQX Food USDA import failure in:title" --json number --jq '.[0].number // empty')
          body="AQX Food automatic USDA release import failed.\n\nRun: ${RUN_URL}\nCommit: ${GITHUB_SHA}\n\nThe importer will retry on its next scheduled run. Review the run before closing this alert."
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "AQX Food USDA import failure" --body "$body"
          fi

      - name: Close resolved USDA import failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list --state open --search "AQX Food USDA import failure in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "AQX Food USDA import recovered successfully in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            gh issue close "$issue_number"
          fi
