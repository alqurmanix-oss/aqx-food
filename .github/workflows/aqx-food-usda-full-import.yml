name: AQX Food guarded full USDA import

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aqx-food-guarded-full-import
  cancel-in-progress: false

jobs:
  import-usda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests ijson
      - name: Run guarded import in 100-record batches
        env:
          AQX_FOOD_FULL_IMPORT_URL: https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-github-full-import
        run: python .github/scripts/usda_guarded_full_import.py
