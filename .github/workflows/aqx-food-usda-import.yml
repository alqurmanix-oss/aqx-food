name: AQX Food USDA archive format probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aqx-food-usda-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect stored USDA archives (read-only)
        env:
          AQX_FOOD_INGEST_URL: https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-github-ingest
        run: python .github/scripts/usda_archive_probe.py
