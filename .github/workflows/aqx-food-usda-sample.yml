name: AQX Food USDA bounded storage sizing sample # automatic bounded measurement

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aqx-food-usda-sample.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: aqx-food-usda-storage-sample
  cancel-in-progress: false

jobs:
  bounded-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sample dependencies
        run: python -m pip install --disable-pip-version-check requests ijson
      - name: Import at most 100 records from each USDA dataset
        env:
          AQX_FOOD_SAMPLE_URL: https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-github-sample
        run: python .github/scripts/usda_storage_sample.py
