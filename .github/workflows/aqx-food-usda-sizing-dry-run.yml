name: AQX Food USDA archive sizing dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aqx-food-usda-sizing-dry-run
  cancel-in-progress: false

jobs:
  sizing-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only sizing dependencies
        run: python -m pip install --disable-pip-version-check requests ijson
      - name: Count USDA records and measure serialized payload (read-only)
        env:
          AQX_FOOD_INGEST_URL: https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-github-ingest
        run: python .github/scripts/usda_archive_sizing_dry_run.py
