.br b{display:block;font:900 19px/1.1 Cairo;color:var(--teal2)}.br small{font-weight:700;font-size:12px;color:var(--gold)}.ac{display:flex;gap:8px;margin-inline-start:auto}
.ib{height:44px;min-width:44px;padding:0 13px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 15px Tajawal;cursor:pointer;color:var(--ink);transition:.25s}.ib:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--gold)}
.hero{position:relative;margin:26px auto 0;max-width:1180px;border-radius:34px;overflow:hidden;padding:70px 34px 60px;text-align:center;color:#fff;background:radial-gradient(600px 300px at 80% 0,rgba(242,217,139,.35),transparent 60%),linear-gradient(135deg,#064E57,#087380 60%,#0E9AA7);box-shadow:0 40px 90px -30px rgba(6,78,87,.7);border:1.5px solid rgba(242,217,139,.6)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px)}.hero>*{position:relative}
.sh{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:40px;background:var(--gg);box-shadow:0 14px 40px rgba(201,150,46,.55);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.hero h1{font:900 clamp(34px,6vw,64px)/1.2 Cairo}.hero h1 span{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{opacity:.92;margin-top:10px;font-size:18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}.chip{padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(242,217,139,.6);font-weight:700;font-size:14px;backdrop-filter:blur(8px)}
.lay{display:grid;grid-template-columns:290px 1fr;gap:28px;margin:34px auto;align-items:start}
aside{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(14px)}aside h4{font-size:16px;color:var(--gold);margin-bottom:8px}
aside a{display:block;padding:6px 11px;border-radius:11px;font-size:13.5px;color:var(--mut);line-height:1.6;transition:.2s}aside a:hover,aside a.on{background:var(--tg);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 30px;margin-bottom:18px;box-shadow:var(--sh);backdrop-filter:blur(12px);position:relative;transition:.3s;opacity:0;transform:translateY(24px)}.sec.v{opacity:1;transform:none}.sec:hover{border-color:var(--gold)}.sec.sp{outline:3px solid var(--gold2);box-shadow:0 0 0 8px rgba(242,217,139,.25)}
.sec:before{content:"";position:absolute;inset-block:22px;inset-inline-start:0;width:5px;border-radius:5px;background:var(--gg)}
.sec h2{font:900 clamp(19px,2.6vw,25px)/1.5 Cairo;color:var(--teal2);margin-bottom:10px}:root[data-t=d] .sec h2{color:#5fe0ec}.sec p{margin:6px 0;color:var(--ink)}.sec ul{list-style:none;margin:8px 0;padding:0}
.sec li{position:relative;padding:3px 26px 3px 0;color:var(--ink)}[dir=ltr] .sec li{padding:3px 0 3px 26px}.sec li:before{content:"◆";position:absolute;inset-inline-start:0;color:var(--gold);font-size:11px;top:9px}.sec li.ck:before{content:"✓";font-size:15px;top:3px;font-weight:900;color:var(--teal)}
.sec h4{color:var(--gold);margin-top:12px;font-size:15px}.sec a.l{color:var(--teal2);font-weight:700;border-bottom:2px solid var(--gold2)}.legal{border:1.5px solid var(--gold);background:linear-gradient(135deg,rgba(242,217,139,.2),transparent)}
.end{margin:30px auto 20px;border-radius:34px;padding:56px 28px;text-align:center;color:#fff;background:radial-gradient(500px 260px at 20% 0,rgba(242,217,139,.3),transparent 60%),linear-gradient(135deg,#064E57,#087380);border:1.5px solid rgba(242,217,139,.6);box-shadow:0 40px 90px -30px rgba(6,78,87,.7)}
.end .orn{font-size:26px;letter-spacing:10px;color:var(--gold2)}.end h3{font:900 clamp(26px,4vw,40px)/1.4 Cairo;margin:10px 0}.end .mt{font:900 clamp(30px,5vw,52px) Cairo;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0}.end p{opacity:.9;max-width:680px;margin:auto}
footer{text-align:center;padding:22px 0 40px;color:var(--mut);font-size:14px}

<script>
var MO={ar:["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],en:["January","February","March","April","May","June","July","August","September","October","November","December"]};
var AR=[["", "مرحبًا بك في AQX Food | مطبخ القرماني إكس، إحدى منصات منظومة ALQURMANI X | AQX.\nتنظم شروط الاستخدام هذه العلاقة بينك وبين AQX Food فيما يتعلق باستخدام الموقع، والمحتوى، والوصفات، والأدوات، والخدمات، والروابط، والخصائص الرقمية المتاحة من خلال المنصة.\nباستخدامك للموقع أو تصفحك لأي صفحة منه أو استخدامك لأي أداة أو خدمة متاحة عليه، فإنك توافق على الالتزام بهذه الشروط. إذا كنت لا توافق على أي جزء من هذه الشروط، فيرجى التوقف عن استخدام الموقع."], ["1. تعريف المنصة", "يقصد بمصطلح AQX Food أو مطبخ القرماني إكس أو المنصة أو الموقع:\nالموقع والخدمات والمحتوى والأدوات والصفحات الرقمية التابعة لـ AQX Food، بما في ذلك النطاق:\nhttps://food-aqx.alqurmanix.com/\nوقد تشمل المنصة مستقبلًا مواقع أو نطاقات فرعية أو تطبيقات أو أدوات مرتبطة بمنظومة ALQURMANI X | AQX.\nويشار إلى المستخدم في هذه الشروط بعبارات: \"المستخدم\" أو \"أنت\" أو \"الزائر\"."], ["2. قبول شروط الاستخدام", "باستخدامك AQX Food، فإنك تؤكد أنك:\n• قرأت هذه الشروط.\n• فهمت مضمونها.\n• توافق على الالتزام بها.\n• تتحمل مسؤولية استخدامك للموقع.\n• تستخدم الموقع بطريقة قانونية ومشروعة.\nإذا كنت تستخدم الموقع نيابة عن شخص أو مؤسسة أو جهة أخرى، فإنك تؤكد أن لديك الصلاحية للقيام بذلك."], ["3. طبيعة AQX Food", "AQX Food منصة رقمية تهدف إلى تقديم محتوى وخدمات مرتبطة بالطعام والطهي والمطبخ.\nوقد تشمل المنصة:\n• وصفات الطعام.\n• المقالات.\n• أفكار الطبخ.\n• طرق التحضير.\n• أدوات حساب المقادير.\n• أدوات حساب الحصص.\n• أدوات حساب السعرات.\n• أدوات حساب التكلفة.\n• محولات وحدات.\n• أدوات المطبخ.\n• معلومات غذائية عامة.\n• توصيات ومنتجات.\n• روابط لمتاجر.\n• روابط تسويق بالعمولة.\n• إعلانات.\n• محتوى من المستخدمين.\n• خدمات رقمية.\n• أدوات تعتمد على المعالجة الآلية أو الذكاء الاصطناعي.\n• خدمات أخرى قد تتم إضافتها مستقبلًا.\nوقد تختلف الخدمات المتاحة من وقت إلى آخر."], ["4. استخدام الموقع", "يُسمح لك باستخدام AQX Food للأغراض الشخصية والمشروعة، وبما يتوافق مع هذه الشروط والقوانين المعمول بها.\nيحظر استخدام الموقع من أجل:\n• ارتكاب أو تسهيل جريمة.\n• الاحتيال.\n• انتحال شخصية شخص آخر.\n• محاولة اختراق الموقع.\n• تجاوز أنظمة الحماية.\n• تعطيل الموقع.\n• إرسال برمجيات ضارة.\n• نشر روابط خبيثة.\n• تنفيذ هجمات آلية ضارة.\n• استخراج بيانات الموقع بطريقة غير مصرح بها.\n• التلاعب بالإعلانات أو الزيارات.\n• التلاعب بأنظمة الإحصاءات.\n• التلاعب بالأدوات.\n• استغلال أي ثغرة أمنية.\n• محاولة الوصول إلى قواعد بيانات أو أنظمة غير مصرح بها.\n• استخدام الموقع بطريقة تؤثر سلبًا على المستخدمين الآخرين."], ["5. الحسابات", "قد تكون بعض خدمات AQX Food متاحة دون إنشاء حساب.\nوقد تتطلب خدمات أخرى تسجيل حساب في المستقبل.\nعند إنشاء حساب، يجب تقديم معلومات صحيحة ودقيقة وعدم استخدام معلومات مضللة أو انتحال شخصية شخص آخر.\nأنت مسؤول عن الحفاظ على سرية بيانات الدخول الخاصة بك.\nولا يجوز مشاركة حسابك بطريقة تخالف شروط الخدمة الخاصة بالخدمة المستخدمة."], ["6. إيقاف الحساب أو الوصول", "يحق للمنصة، في حدود القانون، تعليق أو تقييد أو إيقاف الوصول إلى الموقع أو بعض الخدمات عند وجود أسباب مشروعة، ومنها:\n• مخالفة شروط الاستخدام.\n• إساءة استخدام الموقع.\n• النشاط الاحتيالي.\n• النشاط الآلي الضار.\n• محاولة اختراق الأنظمة.\n• انتهاك حقوق الملكية الفكرية.\n• تهديد أمن المستخدمين.\n• مخالفة القوانين.\n• التلاعب بالإعلانات أو الخدمات.\nوقد يتم ذلك دون إشعار مسبق عندما يكون الإجراء الفوري ضروريًا لحماية الموقع أو المستخدمين."], ["7. المحتوى المنشور على الموقع", "نبذل جهدًا معقولًا لتقديم محتوى مفيد ودقيق.\nومع ذلك، قد يحتوي المحتوى على أخطاء أو معلومات قديمة أو اختلافات في النتائج.\nلا نضمن أن كل معلومة منشورة ستكون:\n• دقيقة بنسبة 100%.\n• كاملة في جميع الحالات.\n• مناسبة لكل شخص.\n• محدثة في جميع الأوقات.\n• خالية من الأخطاء.\nلذلك يجب استخدام المحتوى باعتباره مصدرًا معلوماتيًا وليس ضمانًا لنتيجة معينة."], ["8. الوصفات", "الوصفات المنشورة على AQX Food تقدم لأغراض المعلومات والإرشاد.\nقد تختلف النتيجة النهائية للوصفة بحسب:\n• نوع المكونات.\n• جودة المكونات.\n• العلامة التجارية.\n• الكميات الفعلية.\n• درجة الحرارة.\n• نوع الفرن.\n• نوع أدوات الطهي.\n• الارتفاع عن سطح البحر.\n• مدة الطهي.\n• مهارة المستخدم.\n• ظروف التخزين.\n• اختلاف المكونات بين البلدان.\nلذلك لا نضمن أن تكون النتيجة النهائية مطابقة للصور أو الوصف في كل مرة."], ["9. السلامة الغذائية", "يجب الالتزام بقواعد سلامة الغذاء عند استخدام أي وصفة أو طريقة تحضير.\nيشمل ذلك، على سبيل المثال:\n• غسل اليدين.\n• تنظيف الأدوات.\n• فصل الأطعمة النيئة عن المطهية.\n• طهي اللحوم والدواجن والبيض بصورة مناسبة.\n• حفظ الطعام في درجات الحرارة المناسبة.\n• التحقق من صلاحية المكونات.\n• الانتباه إلى الحساسية الغذائية.\nAQX Food غير مسؤول عن الأضرار الناتجة عن سوء استخدام الوصفات أو سوء تخزين الطعام أو عدم اتباع قواعد السلامة الغذائية."], ["10. الحساسية الغذائية", "قد تحتوي الوصفات على مكونات تسبب حساسية لدى بعض الأشخاص.\nمن مسؤولية المستخدم مراجعة مكونات الوصفة والتأكد من ملاءمتها له.\nإذا كنت تعاني من حساسية غذائية أو حالة صحية خاصة، فيجب عليك استشارة مختص مناسب قبل تناول أي مكون مشكوك فيه."], ["11. المعلومات الغذائية والصحية", "أي معلومات تتعلق بـ:\n• السعرات.\n• البروتين.\n• الكربوهيدرات.\n• الدهون.\n• الفيتامينات.\n• المعادن.\n• الحميات.\n• الوزن.\n• التغذية.\nهي معلومات عامة وليست تشخيصًا طبيًا أو وصفة علاجية.\nلا تعتبر AQX Food بديلًا عن الطبيب أو اختصاصي التغذية."], ["12. أدوات الحساب", "قد توفر المنصة أدوات لحساب:\n• السعرات.\n• المقادير.\n• الحصص.\n• تكلفة الوصفة.\n• تحويل الوحدات.\n• الكميات.\n• النسب.\n• معلومات غذائية أخرى.\nهذه النتائج تقديرية وتعتمد على البيانات المدخلة وقاعدة البيانات والخوارزمية المستخدمة.\nلا نضمن أن النتائج ستطابق القيم الفعلية في جميع الحالات."], ["13. الأسعار والتكاليف", "قد توفر بعض الأدوات تقديرات لتكلفة الوصفات أو المنتجات.\nهذه الأسعار ليست بالضرورة أسعارًا نهائية أو ثابتة.\nقد تختلف الأسعار بسبب:\n• الدولة.\n• المدينة.\n• المتجر.\n• العلامة التجارية.\n• تاريخ الشراء.\n• العروض.\n• الضرائب.\n• تكاليف الشحن.\n• تغير أسعار السوق.\nلذلك يجب التحقق من السعر النهائي لدى البائع قبل الشراء."], ["14. المنتجات والتوصيات", "قد تعرض AQX Food منتجات أو أدوات أو مكونات أو توصيات مرتبطة بالمطبخ والطعام.\nعرض منتج على الموقع لا يعني بالضرورة أن AQX Food يضمن:\n• جودة المنتج.\n• توفره.\n• سعره.\n• أصالته.\n• ملاءمته للمستخدم.\n• أداءه.\nيجب الرجوع إلى البائع أو الشركة المصنعة للحصول على المعلومات النهائية."], ["15. الروابط الخارجية", "قد يحتوي الموقع على روابط تؤدي إلى مواقع خارجية.\nعند انتقالك إلى موقع خارجي، فإنك تستخدمه وفق شروطه وسياسة الخصوصية الخاصة به.\nAQX Food لا يتحكم في:\n• محتوى المواقع الخارجية.\n• أسعارها.\n• توفر منتجاتها.\n• سياساتها.\n• خدماتها.\n• أمنها.\n• ممارساتها المتعلقة بالبيانات."], ["16. روابط التسويق بالعمولة", "قد تحتوي بعض الروابط على نظام Affiliate / تسويق بالعمولة.\nيعني ذلك أن AQX Food قد يحصل على عمولة عند قيام المستخدم بعملية شراء أو تنفيذ إجراء مؤهل من خلال رابط معين، دون أن يعني ذلك بالضرورة زيادة السعر على المستخدم.\nنحن نسعى إلى توضيح الروابط التجارية أو التابعة عندما يكون ذلك مناسبًا.\nولا يعني وجود رابط Affiliate أن AQX Food يضمن المنتج أو البائع."], ["17. الإعلانات", "قد يحتوي الموقع على إعلانات من أطراف خارجية.\nقد تختلف الإعلانات من مستخدم إلى آخر بناءً على عوامل متعددة.\nAQX Food لا يتحكم بصورة كاملة في جميع الإعلانات التي يتم عرضها من خلال شبكات إعلانية خارجية.\nوجود إعلان على الموقع لا يعني أن AQX Food يوصي بالضرورة بالمنتج أو الخدمة المعلن عنها."], ["18. التفاعل مع الإعلانات", "يحظر استخدام أي وسيلة للتلاعب بالإعلانات أو توليد نقرات أو مشاهدات غير حقيقية.\nويشمل ذلك:\n• النقر على الإعلانات بشكل مصطنع.\n• استخدام برامج أو روبوتات.\n• طلب النقرات من الآخرين.\n• إنشاء زيارات وهمية.\n• استخدام أدوات آلية لزيادة المشاهدات.\n• أي طريقة تهدف إلى تضخيم الإيرادات الإعلانية بصورة غير مشروعة.\nقد يؤدي ذلك إلى تقييد الوصول أو اتخاذ إجراءات أخرى مناسبة."], ["19. التعليقات والمحتوى الذي ينشئه المستخدم", "إذا سمحت المنصة بالتعليقات أو إرسال المحتوى، فإن المستخدم مسؤول عن المحتوى الذي ينشره.\nيجب ألا يتضمن المحتوى:\n• إساءة.\n• تهديدًا.\n• تشهيرًا.\n• احتيالًا.\n• محتوى مخالفًا للقانون.\n• معلومات شخصية للآخرين دون إذن.\n• برمجيات ضارة.\n• روابط خبيثة.\n• انتهاكًا لحقوق الملكية الفكرية.\nيجوز للمنصة إزالة أي محتوى مخالف أو غير مناسب."], ["20. حقوق المحتوى الذي يرسله المستخدم", "عند إرسال محتوى إلى AQX Food، يجب أن تكون لديك الحقوق اللازمة لإرساله ونشره.\nلا يجوز إرسال محتوى مملوك لشخص آخر دون الحصول على الإذن اللازم.\nويحتفظ المستخدم بحقوقه في المحتوى الذي يملكه، مع منح AQX Food الإذن اللازم تقنيًا لعرض أو تخزين أو معالجة المحتوى ضمن الخدمة التي أرسله إليها المستخدم."], ["21. الملكية الفكرية", "جميع الحقوق المتعلقة بالمحتوى الأصلي الذي تنتجه AQX Food أو ALQURMANI X محفوظة، بما في ذلك – بحسب ما ينطبق:\n• الاسم.\n• العلامة التجارية.\n• الشعارات.\n• التصميمات.\n• النصوص.\n• الأدوات.\n• الأكواد.\n• الواجهات.\n• الرسومات.\n• العناصر البصرية.\n• قواعد البيانات.\n• البنية التنظيمية للموقع.\nولا يجوز نسخ أو إعادة نشر أو بيع أو توزيع أو إعادة استخدام المحتوى بطريقة تنتهك الحقوق القانونية لأصحابه."], ["22. الاستخدام المسموح للمحتوى", "يمكنك:\n• تصفح المحتوى.\n• قراءته.\n• استخدام الوصفات لأغراضك الشخصية.\n• مشاركة رابط الصفحة.\n• الإشارة إلى المصدر عند الاقتباس المسموح به.\nولا يجوز نسخ الموقع أو تحويل محتواه إلى موقع منافس أو قاعدة بيانات تجارية دون إذن مناسب."], ["23. استخراج المحتوى آليًا", "يُحظر استخدام برامج أو Bots أو Crawlers أو Scrapers لاستخراج كميات كبيرة من المحتوى أو البيانات من AQX Food بهدف:\n• إنشاء قاعدة بيانات منافسة.\n• إعادة نشر المحتوى.\n• بيع البيانات.\n• تجاوز القيود التقنية.\n• استنزاف موارد الموقع.\nولا ينطبق ذلك على محركات البحث التي تصل إلى الصفحات وفق القواعد التقنية المعلنة والمسموح بها."], ["24. الذكاء الاصطناعي", "قد تستخدم بعض الأدوات الحالية أو المستقبلية تقنيات الذكاء الاصطناعي.\nقد تقدم هذه الأدوات:\n• اقتراح وصفات.\n• اقتراح مكونات.\n• تحليل وصفات.\n• حسابات.\n• تصنيفات.\n• إجابات.\n• توصيات.\nقد تنتج أنظمة الذكاء الاصطناعي معلومات غير دقيقة أو غير مكتملة.\nلذلك يجب مراجعة النتائج قبل الاعتماد عليها، خصوصًا عندما يتعلق الأمر بالصحة أو الحساسية أو سلامة الغذاء."], ["25. الخدمات الآلية", "قد تعتمد بعض خدمات الموقع على عمليات آلية أو خوارزميات أو قواعد بيانات.\nوقد تتغير النتائج بسبب تحديث البيانات أو الخوارزميات أو المصادر الخارجية.\nلا نضمن استمرار نتيجة معينة للأداة في جميع الأوقات."], ["26. توفر الموقع", "نسعى إلى إبقاء AQX Food متاحًا ومستقرًا، ولكن لا نضمن أن الموقع سيكون:\n• متاحًا طوال الوقت.\n• خاليًا من الأعطال.\n• خاليًا من الأخطاء.\n• سريعًا دائمًا.\n• متوافقًا مع جميع الأجهزة والمتصفحات.\nقد يتم إيقاف بعض الخدمات مؤقتًا للصيانة أو التحديث أو لأسباب أمنية أو تقنية."], ["27. التحديثات والتغييرات", "يجوز لـ AQX Food:\n• إضافة خدمات.\n• حذف خدمات.\n• تعديل الأدوات.\n• تغيير التصميم.\n• تحديث الخوارزميات.\n• تعديل المحتوى.\n• تغيير مزودي الخدمات.\n• إضافة أو إزالة الإعلانات.\n• تغيير بعض الخصائص.\nوقد يتم ذلك دون الحاجة إلى إخطار كل مستخدم بشكل منفصل."], ["28. الخدمات المجانية", "قد توفر AQX Food بعض الخدمات مجانًا.\nلا يعني توفير خدمة مجانية أن المنصة تضمن استمرارها إلى الأبد.\nيجوز تغيير أو إيقاف الخدمة المجانية أو تعديل خصائصها وفقًا لاحتياجات المنصة والتطوير."], ["29. الخدمات المدفوعة", "إذا تم توفير خدمات مدفوعة مستقبلًا، فسيتم توضيح السعر والشروط وطريقة الدفع قبل إتمام عملية الشراء، وفقًا لما تسمح به الخدمة والقوانين المعمول بها.\nقد تختلف شروط الإلغاء والاسترداد بحسب نوع الخدمة."], ["30. الدفع", "إذا تم توفير الدفع الإلكتروني، فقد يتم تنفيذ عمليات الدفع من خلال مزودي دفع خارجيين.\nقد لا يتم تخزين بيانات البطاقات البنكية مباشرة على أنظمة AQX Food إذا كانت عملية الدفع تتم من خلال مزود دفع خارجي.\nوتخضع عمليات الدفع لشروط مزود الدفع المستخدم."], ["31. الأمن الإلكتروني", "يُمنع محاولة:\n• اختراق الموقع.\n• اكتشاف كلمات المرور.\n• تجاوز أنظمة المصادقة.\n• الوصول إلى لوحة الإدارة.\n• الوصول إلى قواعد البيانات.\n• تعديل البيانات دون تصريح.\n• إدخال برمجيات خبيثة.\n• تنفيذ هجمات DDoS.\n• استغلال الثغرات بطريقة ضارة.\nإذا اكتشفت ثغرة أمنية، يرجى الإبلاغ عنها عبر وسيلة التواصل الرسمية بدلًا من استغلالها."], ["32. إساءة استخدام الموقع", "يجوز اتخاذ إجراءات ضد المستخدم عند استخدام الموقع بصورة تضر:\n• بالمنصة.\n• بالبنية التحتية.\n• بالمستخدمين.\n• بالمعلنين.\n• بالشركاء.\n• بالخدمات الخارجية.\nوقد تشمل الإجراءات حظر الوصول أو حذف المحتوى أو اتخاذ إجراءات قانونية عند الضرورة."], ["33. عدم تقديم ضمانات", "يتم تقديم AQX Food ومحتواه وأدواته \"كما هي\" ووفق ما هو متاح.\nولا نقدم ضمانًا مطلقًا بأن:\n• جميع المعلومات صحيحة دائمًا.\n• كل وصفة ستنجح في جميع الظروف.\n• كل أداة ستنتج نتيجة دقيقة دائمًا.\n• الموقع سيعمل دون انقطاع.\n• جميع الروابط الخارجية ستظل فعالة.\n• المنتجات الخارجية ستظل متاحة.\n• الأسعار ستظل ثابتة."], ["34. حدود المسؤولية", "إلى أقصى حد يسمح به القانون، لا تتحمل AQX Food أو ALQURMANI X مسؤولية الأضرار الناتجة مباشرة أو غير مباشرة عن استخدام الموقع عندما تكون هذه الأضرار ناتجة عن:\n• الاعتماد غير الصحيح على المعلومات.\n• سوء استخدام الوصفات.\n• الحساسية الغذائية.\n• سوء تخزين الطعام.\n• استخدام مكونات غير صالحة.\n• استخدام منتجات خارجية.\n• الروابط الخارجية.\n• انقطاع الخدمات.\n• أخطاء مزودي الخدمات.\n• تغير الأسعار.\n• نتائج الأدوات التقديرية.\n• أعطال الإنترنت أو الأجهزة.\nولا يهدف هذا البند إلى استبعاد أي مسؤولية لا يسمح القانون باستبعادها."], ["35. مسؤولية المستخدم", "أنت مسؤول عن:\n• طريقة استخدامك للموقع.\n• البيانات التي تدخلها.\n• المحتوى الذي تنشره.\n• المنتجات التي تختار شراءها.\n• المكونات التي تستخدمها.\n• القرارات التي تتخذها بناءً على المعلومات المنشورة."], ["36. القوانين المحلية والاختصاص القضائي", "يجب استخدام AQX Food وفق القوانين واللوائح المعمول بها في الدولة التي تستخدم الموقع منها.\nلا يجوز استخدام المنصة لأي نشاط مخالف للقانون.\nتخضع هذه الشروط وتُفسَّر وفقًا لقوانين جمهورية مصر العربية. وفي حال نشوء أي نزاع يتعلق بها وتعذرت تسويته وديًا، تختص محاكم أسوان – جمهورية مصر العربية – اختصاصًا قضائيًا مكانيًا دون غيرها بنظره، بالقدر الذي يسمح به القانون ودون الإخلال بأي حقوق إلزامية مقررة للمستخدم بموجب قانون بلد إقامته."], ["37. الاستخدام من خارج مصر", "قد يكون الموقع متاحًا عالميًا.\nإذا استخدمت AQX Food من خارج مصر، فأنت مسؤول عن الالتزام بالقوانين المحلية المطبقة عليك.\nقد تختلف بعض الخدمات أو الإعلانات أو المحتوى بحسب الدولة."], ["38. الخصوصية", "تخضع معالجة البيانات الشخصية لسياسة الخصوصية الخاصة بـ AQX Food.\nيمكن مراجعة سياسة الخصوصية من خلال صفحة:\nسياسة الخصوصية\nوباستخدام الموقع، فإنك تقر بقراءة وفهم سياسة الخصوصية ذات الصلة."], ["39. الروابط إلى AQX Food", "يسمح بالإشارة إلى AQX Food أو مشاركة روابط صفحاتها بطريقة مشروعة.\nولا يجوز استخدام اسم أو شعار AQX Food بما يوحي بوجود شراكة أو اعتماد رسمي غير موجود."], ["40. العلامات التجارية", "تشمل العلامات والأسماء المرتبطة بالمشروع، بحسب ما ينطبق:\n• AQX\n• ALQURMANI X\n• القرماني إكس\n• AQX Food\n• مطبخ القرماني إكس\nولا يمنح استخدام الموقع أي حق تلقائي في استخدام العلامات التجارية أو الشعارات تجاريًا."], ["41. الاقتباس وإعادة النشر", "يمكن الإشارة إلى المعلومات المنشورة في الحدود التي يسمح بها القانون، مع احترام حقوق الملكية الفكرية.\nولا يسمح بإعادة نشر المقالات أو الوصفات أو الصفحات كاملة بهدف إنشاء محتوى منافس أو تجاري دون الحصول على الإذن اللازم."], ["42. التعديلات على شروط الاستخدام", "يجوز تحديث شروط الاستخدام من وقت لآخر.\nسيتم تعديل تاريخ آخر تحديث في أعلى الصفحة عند إجراء تحديث.\nاستمرارك في استخدام الموقع بعد نشر التحديثات يعني قبولك للشروط المعدلة، بالقدر الذي يسمح به القانون."], ["43. إنهاء الاستخدام", "يمكنك التوقف عن استخدام AQX Food في أي وقت.\nكما يجوز للمنصة تقييد أو إيقاف الوصول إلى بعض الخدمات في الحالات المسموح بها بموجب هذه الشروط."], ["44. قابلية فصل البنود", "إذا تبين أن أحد بنود هذه الشروط غير صالح أو غير قابل للتنفيذ، فلا يؤثر ذلك – قدر الإمكان – على باقي البنود.\nويظل باقي الاتفاق ساريًا في الحدود التي يسمح بها القانون."], ["45. عدم التنازل", "عدم قيام AQX Food بتطبيق بند من هذه الشروط في حالة معينة لا يعني التنازل عن حقها في تطبيق البند نفسه مستقبلًا."], ["46. الاتفاق الكامل", "تمثل شروط الاستخدام هذه، إلى جانب سياسة الخصوصية وأي شروط خاصة بخدمة معينة، الإطار العام لاستخدام AQX Food.\nوقد تكون لبعض الخدمات شروط إضافية يتم عرضها عند استخدامها."], ["47. التواصل", "للاستفسارات المتعلقة بشروط الاستخدام أو الخدمات أو المحتوى، يمكنك التواصل معنا عبر وسيلة الاتصال الرسمية المنشورة على الموقع.\nالموقع:\nhttps://food-aqx.alqurmanix.com/\nالمنصة:\nAQX Food | مطبخ القرماني إكس\nالمنظومة:\nALQURMANI X | AQX\nالمؤسس:\nمحمد بسيوني (أبو عبدالله القرماني)\nالدولة:\nأسوان – جمهورية مصر العربية\nالبريد الرسمي:\ncontact@alqurmanix.com"], ["48. ملخص مبسط للمستخدم", "باستخدامك AQX Food:\n✓ يمكنك الاستفادة من المحتوى والوصفات وفق هذه الشروط.\n✓ يجب استخدام الموقع بطريقة قانونية.\n✓ الوصفات والمعلومات الغذائية إرشادية وليست ضمانًا طبيًا.\n✓ أدوات الحساب تقدم نتائج تقديرية.\n✓ الأسعار والتكاليف قد تتغير.\n✓ المنتجات الخارجية مسؤولية البائع أو الشركة المصنعة.\n✓ الروابط الخارجية تخضع لشروط المواقع الخارجية.\n✓ قد توجد إعلانات وروابط Affiliate.\n✓ يمنع التلاعب بالإعلانات أو الزيارات.\n✓ يمنع اختراق الموقع أو استغلال الثغرات بطريقة ضارة.\n✓ يجب احترام حقوق الملكية الفكرية.\n✓ المستخدم مسؤول عن المحتوى الذي يرسله.\n✓ يمكن تغيير أو تطوير خدمات AQX Food مع مرور الوقت.\n✓ قد يتم إيقاف بعض الخدمات للصيانة أو لأسباب تقنية أو أمنية.\n✓ استمرار استخدام الموقع يعني قبول شروط الاستخدام المحدثة، وفقًا للقانون."], ["49. آخر تحديث", "آخر تحديث: {{M}}\nAQX Food | مطبخ القرماني إكس\nجزء من منظومة:\nALQURMANI X | AQX"]];
