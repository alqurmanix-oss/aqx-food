.br b{display:block;font:900 19px/1.1 Cairo;color:var(--teal2)}.br small{font-weight:700;font-size:12px;color:var(--gold)}.ac{display:flex;gap:8px;margin-inline-start:auto}
.ib{height:44px;min-width:44px;padding:0 13px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 15px Tajawal;cursor:pointer;color:var(--ink);transition:.25s}.ib:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--gold)}
.hero{position:relative;margin:26px auto 0;max-width:1180px;border-radius:34px;overflow:hidden;padding:70px 34px 60px;text-align:center;color:#fff;background:radial-gradient(600px 300px at 80% 0,rgba(242,217,139,.35),transparent 60%),linear-gradient(135deg,#064E57,#087380 60%,#0E9AA7);box-shadow:0 40px 90px -30px rgba(6,78,87,.7);border:1.5px solid rgba(242,217,139,.6)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px)}.hero>*{position:relative}
.sh{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:40px;background:var(--gg);box-shadow:0 14px 40px rgba(201,150,46,.55);animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.hero h1{font:900 clamp(34px,6vw,64px)/1.2 Cairo}.hero h1 span{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{opacity:.92;margin-top:10px;font-size:18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}.chip{padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(242,217,139,.6);font-weight:700;font-size:14px;backdrop-filter:blur(8px)}
.lay{display:grid;grid-template-columns:290px 1fr;gap:28px;margin:34px auto;align-items:start}
aside{position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(14px)}aside h4{font-size:16px;color:var(--gold);margin-bottom:8px}
aside a{display:block;padding:6px 11px;border-radius:11px;font-size:13.5px;color:var(--mut);line-height:1.6;transition:.2s}aside a:hover,aside a.on{background:var(--tg);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 30px;margin-bottom:18px;box-shadow:var(--sh);backdrop-filter:blur(12px);position:relative;transition:.3s;opacity:0;transform:translateY(24px)}.sec.v{opacity:1;transform:none}.sec:hover{border-color:var(--gold)}.sec.sp{outline:3px solid var(--gold2);box-shadow:0 0 0 8px rgba(242,217,139,.25)}
.sec:before{content:"";position:absolute;inset-block:22px;inset-inline-start:0;width:5px;border-radius:5px;background:var(--gg)}
.sec h2{font:900 clamp(19px,2.6vw,25px)/1.5 Cairo;color:var(--teal2);margin-bottom:10px}:root[data-t=d] .sec h2{color:#5fe0ec}.sec p{margin:6px 0;color:var(--ink)}.sec ul{list-style:none;margin:8px 0;padding:0}
.sec li{position:relative;padding:3px 26px 3px 0;color:var(--ink)}[dir=ltr] .sec li{padding:3px 0 3px 26px}.sec li:before{content:"◆";position:absolute;inset-inline-start:0;color:var(--gold);font-size:11px;top:9px}.sec li.ck:before{content:"✓";font-size:15px;top:3px;font-weight:900;color:var(--teal)}
.sec h4{color:var(--gold);margin-top:12px;font-size:15px}.sec a.l{color:var(--teal2);font-weight:700;border-bottom:2px solid var(--gold2)}.legal{border:1.5px solid var(--gold);background:linear-gradient(135deg,rgba(242,217,139,.2),transparent)}
.end{margin:30px auto 20px;border-radius:34px;padding:56px 28px;text-align:center;color:#fff;background:radial-gradient(500px 260px at 20% 0,rgba(242,217,139,.3),transparent 60%),linear-gradient(135deg,#064E57,#087380);border:1.5px solid rgba(242,217,139,.6);box-shadow:0 40px 90px -30px rgba(6,78,87,.7)}
.end .orn{font-size:26px;letter-spacing:10px;color:var(--gold2)}.end h3{font:900 clamp(26px,4vw,40px)/1.4 Cairo;margin:10px 0}.end .mt{font:900 clamp(30px,5vw,52px) Cairo;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent;margin:14px 0}.end p{opacity:.9;max-width:680px;margin:auto}
footer{text-align:center;padding:22px 0 40px;color:var(--mut);font-size:14px}

var AR=[
["","مرحبًا بك في AQX Food | مطبخ القرماني إكس، إحدى منصات ALQURMANI X (AQX).\nنحن نحترم خصوصيتك ونلتزم بحماية المعلومات التي قد يتم جمعها أو معالجتها عند استخدامك لموقعنا وصفحاتنا وأدواتنا وخدماتنا ومحتوانا الرقمي.\nتوضح سياسة الخصوصية هذه كيفية تعامل AQX Food مع المعلومات والبيانات عند زيارتك للموقع أو استخدامك لأي من صفحاته أو أدواته أو خدماته أو تفاعلك مع المحتوى والإعلانات والروابط الخارجية.\nباستخدامك لموقع AQX Food، فإنك تقر بأنك قرأت سياسة الخصوصية هذه وفهمت آلية التعامل مع البيانات الموضحة فيها."],
["1. نبذة عن AQX Food","AQX Food | مطبخ القرماني إكس هو منصة رقمية متخصصة في المحتوى الغذائي والطهي، وتشمل – بحسب الخدمات المتاحة في كل فترة – الوصفات، المقالات الغذائية، أدوات الطبخ، حساب المقادير، الحصص، السعرات الحرارية، التكلفة، النصائح والمعلومات المتعلقة بالطعام والمطبخ، وغيرها من الخدمات الرقمية.\nقد تتغير أو تتوسع خدمات AQX Food بمرور الوقت، وقد تتم إضافة أدوات أو أقسام أو خدمات جديدة دون الحاجة إلى تعديل جوهر هذه السياسة في كل مرة، طالما أن طريقة معالجة البيانات تظل ضمن الحدود الموضحة هنا."],
["2. نطاق سياسة الخصوصية","تنطبق هذه السياسة على:\n• موقع AQX Food.\n• صفحات الموقع الداخلية.\n• الصفحات المستضافة على نطاقات أو نطاقات فرعية تابعة لـ ALQURMANI X عندما تشير صراحة إلى هذه السياسة.\n• الأدوات والتطبيقات المصغرة الموجودة داخل الموقع.\n• نماذج التواصل أو الاشتراك أو التفاعل.\n• الخدمات الرقمية المرتبطة بالموقع.\n• المحتوى المنشور على الموقع.\n• أي خدمات أو خصائص مستقبلية تشير إلى هذه السياسة.\nوقد تحتوي بعض الصفحات على روابط تؤدي إلى مواقع أو خدمات خارجية، وفي هذه الحالة تخضع البيانات التي يتم جمعها على تلك المواقع لسياسات الخصوصية الخاصة بالجهة الخارجية."],
["3. المعلومات التي قد نجمعها","نحن لا نطلب منك تقديم بيانات شخصية لمجرد تصفح معظم محتوى AQX Food.\nومع ذلك، قد يتم جمع بعض المعلومات تلقائيًا أو بإرادتك عند استخدام بعض الخصائص.\nوقد تشمل المعلومات:\n• معلومات تقنية عن الجهاز.\n• نوع الجهاز.\n• نوع المتصفح.\n• نظام التشغيل.\n• لغة المتصفح.\n• حجم الشاشة ودقة العرض.\n• عنوان IP أو جزء منه، عندما يكون ذلك متاحًا لمزودي الخدمات التقنية.\n• الصفحات التي تمت زيارتها.\n• تاريخ ووقت الزيارة.\n• مدة استخدام الصفحة أو الخدمة.\n• الصفحات السابقة أو التالية التي تم الانتقال إليها.\n• مصدر الزيارة أو الرابط الذي أحال المستخدم إلى الموقع.\n• معلومات الأداء والأخطاء التقنية.\n• بيانات التفاعل مع الأدوات.\n• بيانات مجهولة أو مجمعة لأغراض التحليل.\nلا يعني جمع هذه المعلومات تلقائيًا أننا نعرف هوية الزائر الشخصية."],
["4. البيانات التي تقدمها لنا بنفسك","قد تختار تقديم بعض البيانات لنا عند استخدام خصائص معينة.\nعلى سبيل المثال:\n• الاسم.\n• البريد الإلكتروني.\n• الرسالة التي ترسلها من نموذج التواصل.\n• البيانات التي تضعها في أداة أو نموذج معين.\n• المعلومات التي تقدمها عند طلب خدمة.\n• أي بيانات تختار إرسالها بإرادتك.\nنحن لا نطلب منك تقديم بيانات شخصية غير ضرورية لاستخدام الوظيفة التي اخترت استخدامها.\nيرجى عدم إرسال كلمات مرور أو بيانات بطاقات الدفع أو أرقام الحسابات البنكية أو أي معلومات شديدة الحساسية عبر نماذج التواصل العامة، إلا إذا كانت الخدمة مصممة صراحة لاستقبال هذه البيانات بطريقة آمنة."],
["5. بيانات ملفات تعريف الارتباط Cookies","قد يستخدم AQX Food ملفات تعريف الارتباط (Cookies) وتقنيات مشابهة.\nملفات تعريف الارتباط هي ملفات أو بيانات صغيرة قد يتم تخزينها على جهازك عند زيارة موقع إلكتروني.\nقد تستخدم ملفات Cookies لأغراض مثل:\n• تشغيل الموقع بصورة صحيحة.\n• تذكر بعض الإعدادات.\n• تحسين تجربة المستخدم.\n• قياس أداء الصفحات.\n• تحليل حركة الزيارات.\n• فهم كيفية استخدام الموقع.\n• تحسين المحتوى.\n• دعم الإعلانات ذات الصلة.\n• منع بعض الأنشطة غير الطبيعية أو المسيئة.\n• تحسين الخدمات المستقبلية.\nقد تكون بعض ملفات Cookies ضرورية، بينما قد تكون ملفات أخرى مرتبطة بالتحليلات أو الإعلانات أو الخدمات الخارجية.\nيمكنك التحكم في ملفات Cookies من خلال إعدادات المتصفح، وقد يؤدي تعطيل بعضها إلى عدم عمل بعض وظائف الموقع بصورة كاملة."],
["6. خدمات التحليلات وقياس الزيارات","قد يستخدم AQX Food أدوات تحليل وقياس للزيارات لفهم أداء الموقع وسلوك المستخدمين بصورة إحصائية.\nقد تساعد هذه الأدوات في معرفة:\n• عدد الزيارات.\n• الصفحات الأكثر زيارة.\n• مصادر الزيارات.\n• نوع الأجهزة المستخدمة.\n• المتصفحات.\n• البلد أو المنطقة بصورة تقريبية.\n• مدة الجلسة.\n• التفاعل مع عناصر الموقع.\n• الأخطاء والمشكلات التقنية.\nقد تعتمد بعض خدمات التحليل على Cookies أو تقنيات مشابهة.\nيتم استخدام هذه المعلومات بصورة أساسية لتحسين الموقع والمحتوى والأداء، وليس بهدف التعرف عليك شخصيًا."],
["7. الإعلانات","قد يعرض AQX Food إعلانات من أطراف خارجية.\nوقد تستخدم شبكات الإعلانات تقنيات مثل:\n• Cookies.\n• Web Beacons.\n• معرفات إعلانية.\n• تقنيات قياس الأداء.\n• معلومات الجهاز والمتصفح.\n• بيانات الزيارة والتفاعل.\nوقد تستخدم هذه التقنيات لعرض إعلانات أو قياس مدى فعاليتها أو منع التكرار أو اكتشاف الزيارات غير الصالحة.\nلا يتحكم AQX Food بشكل كامل في البيانات التي تجمعها شبكات الإعلانات الخارجية، ولذلك ننصحك بمراجعة سياسات الخصوصية الخاصة بمزود الإعلانات الذي يظهر لك.\nقد تتغير شبكات الإعلانات المستخدمة في الموقع بمرور الوقت."],
["8. Google وGoogle AdSense والخدمات الإعلانية","قد يستخدم AQX Food خدمات إعلانية تابعة لشركات خارجية، ومنها Google، إذا تم تفعيل هذه الخدمات على الموقع.\nقد تستخدم Google أو شركاؤها ملفات تعريف الارتباط أو تقنيات مشابهة لعرض الإعلانات أو قياسها.\nوتخضع معالجة البيانات من جانب Google لسياسات Google وشروطها الخاصة.\nيمكن للمستخدم مراجعة إعدادات الإعلانات والخصوصية المتاحة له من خلال خدمات Google.\nولا يعني وجود هذه الإعلانات أن AQX Food يتحكم في كل محتوى إعلاني يظهر للمستخدم."],
["9. الروابط الخارجية والروابط التابعة Affiliate Links","قد يحتوي AQX Food على روابط لمواقع أو خدمات أو منتجات خارجية.\nوقد تكون بعض الروابط:\n• روابط عادية.\n• روابط لمصادر أو مراجع.\n• روابط لخدمات خارجية.\n• روابط تسويق بالعمولة Affiliate Links.\n• روابط لمتاجر إلكترونية.\n• روابط لشركاء أو معلنين.\nعند انتقالك إلى موقع خارجي، تصبح خاضعًا لسياسة الخصوصية وشروط استخدام ذلك الموقع.\nAQX Food غير مسؤول عن ممارسات الخصوصية أو الأمان أو المحتوى أو البيانات التي تجمعها المواقع الخارجية.\nننصحك دائمًا بقراءة سياسة الخصوصية الخاصة بالموقع الذي تنتقل إليه قبل إدخال أي معلومات شخصية."],
["10. المعلومات الغذائية والصحية","المحتوى المنشور على AQX Food هو محتوى معلوماتي وتثقيفي وترفيهي في المقام الأول.\nأي معلومات متعلقة بـ:\n• السعرات الحرارية.\n• القيم الغذائية.\n• المكونات.\n• الحميات الغذائية.\n• الوزن.\n• الحساسية الغذائية.\n• الأنظمة الغذائية.\n• الصحة والتغذية.\nلا تعتبر تشخيصًا طبيًا أو استشارة طبية أو علاجًا طبيًا.\nقد تختلف القيم الغذائية والسعرات الحرارية الفعلية حسب نوع المكونات، العلامة التجارية، الكمية، طريقة التحضير، طريقة القياس، ظروف التخزين وعوامل أخرى.\nيجب استشارة طبيب أو اختصاصي تغذية مؤهل عند الحاجة، خصوصًا في حالات الأمراض المزمنة أو الحساسية الغذائية أو الحمل أو الحالات الطبية الخاصة."],
["11. أدوات حساب السعرات والمقادير والتكلفة","قد يوفر AQX Food أدوات إلكترونية لحساب:\n• المقادير.\n• عدد الحصص.\n• السعرات.\n• التكلفة.\n• التحويلات.\n• الوحدات.\n• الكميات.\n• نسب المكونات.\n• معلومات غذائية أخرى.\nهذه الأدوات تقدم نتائج تقديرية مبنية على البيانات المدخلة والخوارزميات أو قواعد البيانات المستخدمة.\nلا نضمن أن تكون النتائج مطابقة للقيم الفعلية في كل حالة.\nالأسعار، المقادير والقيم الغذائية قد تتغير.\nيجب اعتبار النتائج إرشادية وليست بديلًا عن القياس الفعلي أو الاستشارة المتخصصة."],
["12. التعليقات والتفاعل مع المحتوى","قد تتوفر في بعض صفحات AQX Food إمكانية التعليق أو التفاعل.\nعند نشر تعليق أو محتوى بشكل عام، يجب أن تدرك أن المعلومات التي تنشرها قد تصبح مرئية للآخرين.\nننصح بعدم نشر:\n• أرقام الهواتف.\n• عناوين المنازل.\n• كلمات المرور.\n• بيانات البطاقات البنكية.\n• معلومات شخصية حساسة.\n• أي معلومات لا ترغب في ظهورها للعامة.\nقد يتم حذف التعليقات التي تخالف القوانين أو قواعد الموقع أو تحتوي على إساءة أو محتوى ضار أو مضلل أو غير مناسب."],
["13. التواصل معنا","إذا تواصلت معنا عبر البريد الإلكتروني أو نموذج التواصل أو أي وسيلة أخرى، فقد نحتفظ بالمعلومات التي ترسلها لنا بهدف:\n• الرد على رسالتك.\n• معالجة طلبك.\n• حل مشكلة تقنية.\n• متابعة استفسار.\n• تحسين الخدمة.\n• منع إساءة الاستخدام.\nقد تتضمن الرسالة اسمك أو بريدك الإلكتروني أو أي بيانات تختار تضمينها.\nنحن نستخدم هذه البيانات بالقدر اللازم للغرض الذي تم تقديمها من أجله."],
["14. حماية البيانات","نحن نتخذ إجراءات تقنية وتنظيمية معقولة للمساعدة في حماية البيانات من:\n• الوصول غير المصرح به.\n• الاستخدام غير المشروع.\n• التعديل غير المصرح به.\n• الفقد.\n• التلف.\n• الإفشاء غير المصرح به.\nومع ذلك، لا يمكن لأي نظام متصل بالإنترنت أن يضمن أمانًا بنسبة 100%.\nلذلك لا يمكننا ضمان الحماية المطلقة لأي بيانات يتم إرسالها عبر الإنترنت."],
["15. مشاركة المعلومات مع أطراف أخرى","لا نبيع بيانات المستخدمين الشخصية لمجرد بيعها أو المتاجرة بها.\nومع ذلك، قد تتم معالجة بعض البيانات بواسطة أطراف خارجية عند الحاجة إلى تشغيل الموقع أو الخدمات، مثل:\n• مزودي الاستضافة.\n• خدمات التحليلات.\n• شبكات الإعلانات.\n• مزودي البريد الإلكتروني.\n• مزودي الخدمات التقنية.\n• خدمات الحماية والأمان.\n• خدمات مكافحة الاحتيال.\n• خدمات التخزين.\n• مزودي الخدمات السحابية.\n• مزودي أدوات الموقع.\nوقد نشارك أو نكشف المعلومات عندما يكون ذلك ضروريًا:\n• لتنفيذ خدمة طلبها المستخدم.\n• لحماية الموقع والمستخدمين.\n• لمنع الاحتيال أو إساءة الاستخدام.\n• للامتثال للقوانين أو الإجراءات القانونية.\n• لحماية الحقوق والممتلكات.\n• لتنفيذ أو تطبيق شروط استخدام الموقع."],
["16. البيانات المجمعة والمجهولة","قد نستخدم بيانات إحصائية مجمعة أو مجهولة المصدر.\nعلى سبيل المثال:\n• عدد الزوار.\n• نسبة استخدام الأجهزة.\n• أكثر الصفحات زيارة.\n• مصادر الزيارات.\n• أوقات النشاط.\n• الإحصاءات العامة للموقع.\nلا تهدف هذه البيانات إلى تحديد هوية المستخدم بشكل مباشر.\nوقد يتم استخدامها في التقارير والتحليلات وتحسين المنتجات والخدمات."],
["17. الاحتفاظ بالبيانات","نحتفظ بالبيانات فقط بالقدر والمدة اللازمة للغرض الذي تم جمعها من أجله، أو حسب ما تقتضيه الحاجة القانونية أو التشغيلية أو الأمنية.\nقد تختلف مدة الاحتفاظ بحسب نوع البيانات.\nفعلى سبيل المثال، قد يتم الاحتفاظ ببعض سجلات الأمان لفترة أطول من بيانات التحليلات العامة إذا كان ذلك ضروريًا لحماية الموقع أو التحقيق في إساءة الاستخدام."],
["18. حذف البيانات","إذا قدمت لنا بيانات شخصية بشكل مباشر، يمكنك طلب حذفها أو تصحيحها عندما يكون ذلك ممكنًا ومناسبًا.\nقد نطلب معلومات كافية للتحقق من أن طلب الحذف أو التعديل صادر من صاحب البيانات أو من شخص مخول بذلك.\nقد لا يكون حذف بعض البيانات ممكنًا عندما يكون الاحتفاظ بها:\n• مطلوبًا قانونيًا.\n• ضروريًا لأغراض أمنية.\n• ضروريًا لإثبات أو حماية الحقوق.\n• مرتبطًا بسجلات لا يمكن تعديلها بشكل منفصل.\n• مطلوبًا للامتثال لالتزام قانوني."],
["19. حقوق المستخدم","بحسب القوانين واللوائح السارية على المستخدم ومكان إقامته، قد تكون له بعض الحقوق المتعلقة ببياناته، ومنها:\n• معرفة نوع البيانات التي تتم معالجتها.\n• طلب الوصول إلى البيانات.\n• طلب تصحيح البيانات غير الدقيقة.\n• طلب حذف البيانات في الحالات التي يسمح بها القانون.\n• الاعتراض على بعض أنواع المعالجة.\n• طلب تقييد معالجة معينة.\n• سحب موافقة سابقة عندما تكون المعالجة قائمة على الموافقة.\n• التحكم في بعض أنواع Cookies أو الإعلانات من خلال إعدادات المتصفح أو الخدمات ذات الصلة.\nلا تعني هذه الحقوق أنها مطلقة في جميع الحالات، وقد توجد استثناءات قانونية."],
["20. الأطفال والقُصّر","AQX Food منصة محتوى عامة.\nنحن لا نهدف إلى جمع بيانات شخصية حساسة من الأطفال.\nإذا كان المستخدم قاصرًا، فينبغي استخدام الخدمات التي تتطلب تقديم بيانات شخصية تحت إشراف ولي الأمر أو وفق القوانين المعمول بها.\nإذا علمت أن طفلًا قدم لنا معلومات شخصية بطريقة غير مناسبة، يمكنك التواصل معنا لطلب مراجعة هذه البيانات واتخاذ الإجراء المناسب."],
["21. الخدمات والمنصات التابعة لـ AQX","قد يكون AQX Food جزءًا من منظومة ALQURMANI X (AQX) التي تضم مواقع ومنصات وخدمات رقمية متعددة.\nقد تتكامل بعض الخدمات تقنيًا أو تشترك في بعض البنية التحتية، إلا أن كل منصة قد يكون لها نطاق مختلف من الخدمات وطريقة مختلفة في معالجة البيانات.\nعند استخدام خدمة أخرى تابعة لـ AQX، يرجى مراجعة سياسة الخصوصية الخاصة بتلك الخدمة إذا كانت متوفرة."],
["22. قواعد البيانات والخدمات التقنية","قد تستخدم بعض خدمات AQX قواعد بيانات أو خدمات سحابية أو واجهات برمجية (APIs) لتخزين أو معالجة البيانات.\nقد يتم تخزين البيانات على خوادم تابعة لمزودي خدمات تقنية داخل مصر أو خارجها بحسب البنية التحتية المستخدمة.\nنحن نختار الخدمات التقنية بهدف توفير الاستقرار والأمان والأداء، مع إدراك أن أي بنية تحتية إلكترونية قد تتعرض لمخاطر تقنية."],
["23. نقل البيانات عبر الحدود","قد يتم معالجة أو تخزين بعض البيانات بواسطة مزودي خدمات موجودين في دول مختلفة عن الدولة التي يقيم فيها المستخدم.\nيحدث ذلك نتيجة استخدام خدمات الاستضافة أو التحليلات أو الخدمات السحابية أو الإعلانات أو الأدوات التقنية العالمية.\nعند استخدام هذه الخدمات، قد تخضع البيانات للقوانين والأنظمة المطبقة في الدول التي تتم فيها المعالجة."],
["24. السجلات الأمنية ومكافحة إساءة الاستخدام","قد يتم تسجيل بعض المعلومات التقنية لأغراض أمنية، مثل:\n• محاولات الدخول.\n• محاولات الوصول غير الطبيعية.\n• أخطاء النظام.\n• النشاط المشبوه.\n• محاولات إساءة استخدام الأدوات.\n• محاولات الاحتيال أو التلاعب.\nتستخدم هذه المعلومات للمساعدة في حماية الموقع والمستخدمين والبنية التحتية."],
["25. منع الاحتيال والزيارات غير الصالحة","قد نستخدم أدوات وتقنيات لاكتشاف:\n• الزيارات الآلية الضارة.\n• الروبوتات المسيئة.\n• النقرات غير الطبيعية.\n• محاولات التلاعب بالإعلانات.\n• النشاط الاحتيالي.\n• الاستخدام المفرط أو غير المشروع للخدمات.\nقد يؤدي اكتشاف نشاط مشبوه إلى حظر أو تقييد الوصول إلى بعض الخدمات."],
["26. الذكاء الاصطناعي والخدمات الآلية","قد تستخدم بعض خدمات AQX الحالية أو المستقبلية تقنيات الذكاء الاصطناعي أو المعالجة الآلية لتقديم:\n• اقتراحات.\n• بحث.\n• تصنيف.\n• تحليل محتوى.\n• أدوات طبخ ذكية.\n• مساعدات أو أدوات حسابية.\n• تحسين تجربة المستخدم.\nإذا كانت إحدى الخدمات تستخدم بيانات المستخدم في معالجة تعتمد على الذكاء الاصطناعي، فسيتم التعامل مع البيانات وفق الغرض المعلن للخدمة والضوابط المعمول بها.\nلا ينبغي إدخال معلومات شخصية حساسة في أي أداة ذكاء اصطناعي ما لم تكن الخدمة مصممة بوضوح لاستقبالها."],
["27. المحتوى الذي ينشئه المستخدم","إذا سمحت المنصة للمستخدمين بإرسال وصفات أو تعليقات أو صور أو تقييمات أو محتوى آخر، فإن المستخدم يتحمل مسؤولية المحتوى الذي يرسله.\nيجب ألا يتضمن المحتوى:\n• معلومات شخصية لشخص آخر دون إذنه.\n• محتوى مخالفًا للقانون.\n• محتوى احتيالي.\n• محتوى ضار.\n• برمجيات خبيثة.\n• حقوق ملكية فكرية لا يملك المستخدم حق نشرها.\nقد يتم حذف المحتوى المخالف."],
["28. الملكية الفكرية","المحتوى المنشور على AQX Food، بما في ذلك النصوص والتصميمات والعلامات والأدوات والعناصر البرمجية والصور التي نملك حقوقها، قد يكون محميًا بموجب قوانين الملكية الفكرية.\nلا يجوز نسخ أو إعادة نشر أو توزيع المحتوى بطريقة تنتهك حقوق الملكية الفكرية.\nقد يحتوي الموقع أيضًا على محتوى أو صور أو روابط مرخصة من أطراف أخرى، وتظل حقوقها لأصحابها."],
["29. دقة المعلومات","نبذل جهدًا معقولًا للحفاظ على دقة المعلومات المنشورة.\nومع ذلك، قد تحتوي بعض المعلومات على أخطاء أو تصبح قديمة بمرور الوقت.\nخصوصًا:\n• الأسعار.\n• التوافر.\n• القيم الغذائية.\n• السعرات.\n• أوقات الطهي.\n• المقادير.\n• معلومات المنتجات.\n• الروابط الخارجية.\nلذلك ينبغي التحقق من المعلومات المهمة قبل اتخاذ قرار يعتمد عليها."],
["30. التغييرات في سياسة الخصوصية","قد نقوم بتحديث سياسة الخصوصية من وقت لآخر.\nعند إجراء تحديث، سيتم تعديل تاريخ \"آخر تحديث\" الموجود أعلى الصفحة.\nقد تكون التغييرات جوهرية أو بسيطة بحسب طبيعة التطوير أو التغيير في الخدمات.\nننصح المستخدمين بمراجعة هذه الصفحة بشكل دوري."],
["31. قبول سياسة الخصوصية","باستخدامك لموقع AQX Food، فإنك تقر بأنك قرأت وفهمت هذه السياسة.\nإذا كنت لا توافق على أي جزء منها، يمكنك التوقف عن استخدام الموقع أو الخدمات التي لا توافق على شروطها."],
["32. مسؤولية الخدمات الخارجية","قد يتكامل الموقع مع خدمات خارجية مثل:\n• Google.\n• خدمات الإعلانات.\n• خدمات التحليل.\n• YouTube.\n• Telegram.\n• خدمات التواصل الاجتماعي.\n• المتاجر الإلكترونية.\n• خدمات الدفع – إن وجدت.\n• خدمات الاستضافة.\n• خدمات التخزين السحابي.\n• أدوات الطرف الثالث.\nكل خدمة خارجية لها شروطها وسياسة الخصوصية الخاصة بها.\nAQX Food لا يملك السيطرة الكاملة على سياسات أو تقنيات الجهات الخارجية."],
["33. أمن الروابط الخارجية","نحاول استخدام روابط موثوقة، لكن لا يمكننا ضمان استمرار أمان أو توفر جميع المواقع الخارجية.\nلذلك يجب على المستخدم توخي الحذر عند الانتقال إلى أي موقع خارجي أو تنزيل أي ملف أو تقديم أي بيانات."],
["34. البيانات المتعلقة بالإعلانات والقياس","قد تستخدم المنصة أو شركاؤها تقنيات قياس لفهم:\n• مرات ظهور الإعلانات.\n• التفاعل مع الإعلانات.\n• عدد مرات النقر.\n• الأداء العام للحملات.\n• الزيارات الناتجة عن الإعلانات.\nوقد تكون بعض البيانات مجهولة أو مجمعة.\nنحن لا نضمن أن الإعلانات التي تظهر على الموقع ستكون متوافقة دائمًا مع اهتمامات كل مستخدم."],
["35. عدم بيع البيانات الشخصية","لا يتمثل نموذج AQX Food في بيع البيانات الشخصية للمستخدمين.\nوقد تتم معالجة البيانات من خلال مزودي الخدمات الذين يساعدوننا في تشغيل الموقع أو الإعلانات أو التحليلات أو الأمن أو الخدمات التقنية.\nولا يُقصد من استخدام هذه الخدمات تحويل بيانات المستخدم الشخصية إلى منتج يتم بيعه بشكل مستقل."],
["36. الحد الأدنى من جمع البيانات","نحن نؤمن بمبدأ جمع البيانات بالقدر اللازم.\nلذلك، عندما تكون البيانات الشخصية غير مطلوبة لتشغيل وظيفة معينة، لا يلزم تقديمها لمجرد تصفح المحتوى العام.\nقد تختلف هذه القاعدة في الخدمات التي تتطلب تسجيل حساب أو تقديم طلب أو استخدام ميزة محددة."],
["37. استخدام الموقع من خارج مصر","AQX Food قد يكون متاحًا للمستخدمين من دول مختلفة.\nإذا دخلت إلى الموقع من خارج مصر، فإنك تتحمل مسؤولية التأكد من أن استخدامك للخدمة يتوافق مع القوانين المحلية المطبقة عليك.\nقد تختلف حقوق الخصوصية من دولة إلى أخرى."],
["38. القانون الواجب التطبيق والاختصاص القضائي","يتم تفسير هذه السياسة وتطبيقها وفقًا للقوانين والأنظمة المعمول بها في جمهورية مصر العربية، ومنها قانون حماية البيانات الشخصية رقم 151 لسنة 2020، مع مراعاة الحقوق الإلزامية التي قد يتمتع بها المستخدم بموجب قوانين الدولة التي يقيم فيها.\nتُحل أي نزاعات ودية أولًا عبر التواصل مع AQX Food بحسن نية.\nوفي حال تعذّر التسوية الودية، تختص محاكم أسوان – جمهورية مصر العربية – اختصاصًا قضائيًا مكانيًا دون غيرها بنظر أي نزاع أو مطالبة تنشأ عن هذه السياسة أو تتعلق بها أو بتفسيرها أو تنفيذها، وذلك بالقدر الذي يسمح به القانون، ودون الإخلال بأي حقوق إلزامية مقررة للمستخدم بموجب القانون الواجب التطبيق."],
["39. التواصل بشأن الخصوصية","إذا كانت لديك أسئلة أو طلبات تتعلق بالخصوصية أو البيانات الشخصية أو حذف البيانات أو تصحيحها، يمكنك التواصل معنا من خلال وسيلة الاتصال الرسمية المنشورة على موقع AQX Food.\nالبريد الإلكتروني:\ncontact@alqurmanix.com\nالموقع:\nhttps://food-aqx.alqurmanix.com/\nالجهة:\nAQX Food | مطبخ القرماني إكس\nالعلامة:\nALQURMANI X | AQX\nالمؤسس:\nمحمد بسيوني (أبو عبدالله القرماني)\nالموقع الجغرافي المعلن للمنصة:\nأسوان – جمهورية مصر العربية"],
["40. إشعار مهم","هذه السياسة تهدف إلى توضيح ممارسات الخصوصية بصورة شفافة ومفهومة.\nوجود هذه السياسة لا يعني أن جميع الخدمات أو تقنيات جمع البيانات المذكورة فيها مستخدمة في كل صفحة أو في كل وقت.\nقد تختلف الخدمات والأدوات ومزودو الخدمات بحسب الصفحة أو الدولة أو الجهاز أو التحديثات التقنية.\nلذلك، يتم تطبيق البنود ذات الصلة بحسب الخدمة التي يستخدمها الزائر فعليًا."],
["41. ملخص سريع لخصوصيتك","باختصار:\n✓ يمكنك تصفح جزء كبير من محتوى AQX Food دون إنشاء حساب.\n✓ قد يتم جمع بيانات تقنية وإحصائية تلقائيًا لتحسين الموقع والأمان والأداء.\n✓ قد تستخدم المنصة Cookies وتقنيات مشابهة.\n✓ قد تظهر إعلانات من شركات خارجية.\n✓ قد تستخدم خدمات التحليل وقياس الزيارات.\n✓ قد تحتوي الصفحات على روابط خارجية وروابط Affiliate.\n✓ المواقع الخارجية لها سياسات خصوصية مستقلة.\n✓ لا نهدف إلى بيع البيانات الشخصية للمستخدمين.\n✓ يمكنك تجنب إرسال معلومات حساسة عبر نماذج التواصل العامة.\n✓ يمكنك طلب مراجعة أو تصحيح أو حذف البيانات التي قدمتها لنا، عندما يكون ذلك ممكنًا قانونيًا وتقنيًا.\n✓ قد يتم الاحتفاظ ببعض السجلات لأغراض قانونية أو أمنية أو تقنية.\n✓ قد تتغير هذه السياسة مع تطور AQX Food وخدماته."]

["","Welcome to AQX Food | ALQURMANI X Kitchen, a platform of ALQURMANI X (AQX).\nWe respect your privacy and are committed to protecting information that may be collected or processed when you use our website, pages, tools, services and digital content.\nThis policy explains how AQX Food handles information when you visit the site, use its pages, tools or services, or interact with content, ads and external links.\nBy using AQX Food you acknowledge that you have read this policy and understood how data is handled."],
["1. About AQX Food","AQX Food is a digital platform for food and cooking content: recipes, food articles, cooking tools, ingredient, serving, calorie and cost calculators, tips and other digital services, depending on what is available at any time.\nServices may change or expand, and new tools or sections may be added without amending the core of this policy, as long as data handling stays within the limits described here."],
["2. Scope of this policy","This policy applies to the AQX Food website and its inner pages; pages on ALQURMANI X domains or subdomains that explicitly refer to it; built-in tools and mini-apps; contact, subscription and interaction forms; related digital services; published content; and any future services that refer to this policy.\nPages may link to external sites; data collected there is governed by those third parties' own privacy policies."],
["3. Information we may collect","We do not ask for personal data merely to browse most AQX Food content. Some information may be collected automatically or voluntarily when you use certain features, including:\n• Device information, device type, browser, operating system and browser language.\n• Screen size and resolution.\n• IP address or part of it, where available to technical service providers.\n• Pages visited, date and time, session duration, and previous/next pages.\n• Referral source.\n• Performance and error data, and tool interaction data.\n• Anonymous or aggregated data for analysis.\nCollecting this automatically does not mean we know who you are."],
["4. Data you provide","You may choose to provide: your name, email, messages sent through the contact form, data entered in a tool or form, information given when requesting a service, or anything else you choose to send.\nWe do not ask for personal data that is unnecessary for the function you chose.\nPlease do not send passwords, payment card data, bank account numbers or highly sensitive information through general contact forms, unless a service is expressly designed to receive them securely."],
["5. Cookies","AQX Food may use cookies and similar technologies: small files stored on your device when you visit a site.\nThey may be used to run the site properly, remember settings, improve experience, measure page performance, analyze traffic, understand site use, improve content, support relevant ads, prevent abnormal or abusive activity, and improve future services.\nSome cookies are necessary; others relate to analytics, ads or external services.\nYou can control cookies in your browser settings; disabling some may stop parts of the site from working fully."],
["6. Analytics and visit measurement","We may use analytics tools to understand site performance and user behavior statistically: number of visits, most visited pages, traffic sources, device types, browsers, approximate country or region, session length, interaction with site elements, and technical errors.\nSome tools rely on cookies or similar technologies.\nThis information is used mainly to improve the site, content and performance, not to identify you personally."],
["7. Advertising","AQX Food may display third-party ads. Ad networks may use cookies, web beacons, advertising identifiers, performance-measurement technologies, device and browser information, and visit and interaction data to show ads, measure effectiveness, prevent repetition or detect invalid traffic.\nAQX Food does not fully control data collected by external ad networks; we recommend reviewing the privacy policy of the ad provider shown to you. Ad networks may change over time."],
["8. Google, AdSense and ad services","AQX Food may use third-party ad services, including Google, if enabled on the site. Google or its partners may use cookies or similar technologies to serve or measure ads.\nGoogle's data processing is subject to Google's own policies and terms. Users can review their ad and privacy settings through Google services.\nThe presence of ads does not mean AQX Food controls all advertising content shown to you."],
["9. External and affiliate links","AQX Food may contain links to external sites, services or products: ordinary links, source or reference links, external services, affiliate (commission) links, online stores, and partner or advertiser links.\nOnce you move to an external site, that site's privacy policy and terms apply. AQX Food is not responsible for the privacy, security, content or data practices of external sites. Please read their policy before entering personal information."],
["10. Nutrition and health information","Content on AQX Food is primarily informational, educational and entertaining. Information about calories, nutritional values, ingredients, diets, weight, food allergies and health or nutrition is not medical diagnosis, advice or treatment.\nActual values vary with ingredients, brand, quantity, preparation, measurement method, storage conditions and other factors.\nConsult a qualified doctor or dietitian when needed, especially for chronic illness, allergies, pregnancy or special medical conditions."],
["11. Calorie, quantity and cost tools","AQX Food may provide tools to calculate quantities, servings, calories, cost, conversions, units, amounts, ingredient ratios and other nutrition information.\nThey give estimates based on your input and the algorithms or databases used. We do not guarantee results match actual values; prices, quantities and nutrition values may change.\nTreat results as guidance, not a substitute for real measurement or expert advice."],
["12. Comments and interaction","Some pages may allow comments or interaction. Information you post publicly may become visible to others.\nWe advise against posting phone numbers, home addresses, passwords, bank card data, sensitive personal information, or anything you do not want public.\nComments that violate the law or site rules, or are abusive, harmful, misleading or inappropriate, may be removed."],
["13. Contacting us","If you contact us by email, form or any other means, we may keep what you send in order to reply, process your request, solve a technical problem, follow up an inquiry, improve the service and prevent abuse.\nYour message may include your name, email or any data you choose to include. We use it only as needed for the purpose it was provided."],
["14. Data protection","We take reasonable technical and organizational measures to help protect data from unauthorized access, unlawful use, unauthorized modification, loss, damage and unauthorized disclosure.\nHowever, no internet-connected system can guarantee 100% security, so we cannot guarantee absolute protection of data sent over the internet."],
["15. Sharing information","We do not sell users' personal data merely to sell or trade it.\nSome data may be processed by third parties needed to run the site: hosting, analytics, ad networks, email, technical, security, anti-fraud, storage, cloud and site-tool providers.\nWe may share or disclose information when necessary to perform a service the user requested, protect the site and users, prevent fraud or abuse, comply with law or legal process, protect rights and property, or enforce the site's terms."],
["16. Aggregated and anonymous data","We may use aggregated or anonymous statistics such as visitor counts, device share, most visited pages, traffic sources, activity times and general site statistics.\nThese are not intended to directly identify you and may be used in reports, analysis and improving products and services."],
["17. Data retention","We keep data only as long as needed for the purpose it was collected, or as legal, operational or security needs require. Retention varies by data type; for example, some security logs may be kept longer than general analytics if necessary to protect the site or investigate abuse."],
["18. Data deletion","If you gave us personal data directly, you may request its deletion or correction where possible and appropriate. We may ask for enough information to verify the request comes from the data owner or an authorized person.\nDeletion may not be possible where retention is legally required, needed for security, needed to establish or protect rights, tied to records that cannot be modified separately, or required to meet a legal obligation."],
["19. User rights","Depending on the laws applicable to you and your residence, you may have rights to: know what data is processed; request access; request correction of inaccurate data; request deletion where the law allows; object to certain processing; request restriction; withdraw consent where processing is consent-based; and control some cookies or ads through browser settings or related services.\nThese rights are not absolute in every case; legal exceptions may apply."],
["20. Children and minors","AQX Food is a general content platform. We do not aim to collect sensitive personal data from children. Minors should use services requiring personal data under a guardian's supervision or per applicable law.\nIf you learn a child gave us personal information inappropriately, contact us to review it and take appropriate action."],
["21. AQX affiliated platforms","AQX Food may be part of the ALQURMANI X (AQX) ecosystem of multiple sites, platforms and digital services. Some may integrate technically or share infrastructure, but each may differ in scope and data handling. When using another AQX service, please review its own privacy policy if available."],
["22. Databases and technical services","Some AQX services may use databases, cloud services or APIs to store or process data. Data may be stored on servers of technical providers inside or outside Egypt, depending on the infrastructure used.\nWe choose services for stability, security and performance, while recognizing that any electronic infrastructure may face technical risks."],
["23. Cross-border data transfer","Some data may be processed or stored by providers in countries different from where you live, through hosting, analytics, cloud, ads or global technical tools. Data may then be subject to the laws of the countries where processing takes place."],
["24. Security logs and abuse prevention","Some technical information may be logged for security: login attempts, abnormal access attempts, system errors, suspicious activity, tool abuse, and fraud or manipulation attempts. It is used to help protect the site, users and infrastructure."],
["25. Fraud and invalid traffic prevention","We may use tools to detect harmful automated traffic, abusive bots, abnormal clicks, ad manipulation, fraudulent activity, and excessive or unlawful use of services. Suspicious activity may lead to blocking or restricting access to some services."],
["26. AI and automated services","Current or future AQX services may use AI or automated processing for suggestions, search, classification, content analysis, smart cooking tools, calculation aids and user-experience improvement.\nIf a service uses your data in AI-based processing, it will be handled per the service's stated purpose and applicable controls. Do not enter sensitive personal information into any AI tool unless the service is clearly designed to receive it."],
["27. User-generated content","If the platform lets users submit recipes, comments, images, ratings or other content, the user is responsible for what they submit. Content must not include another person's personal information without permission, unlawful, fraudulent or harmful content, malware, or intellectual property the user has no right to publish. Violating content may be removed."],
["28. Intellectual property","Content on AQX Food, including texts, designs, marks, tools, code and images we own, may be protected by intellectual property laws. Copying, republishing or distributing content in a way that infringes those rights is not allowed.\nThe site may also contain content, images or links licensed from others, whose rights remain with their owners."],
["29. Accuracy of information","We make reasonable efforts to keep published information accurate, but some may contain errors or become outdated, especially prices, availability, nutrition values, calories, cooking times, quantities, product information and external links. Verify important information before relying on it."],
["30. Changes to this policy","We may update this policy from time to time. When updated, the \"last updated\" date at the top is adjusted. Changes may be major or minor depending on service development. We advise reviewing this page periodically."],
["31. Acceptance","By using AQX Food you acknowledge that you have read and understood this policy. If you do not agree with any part, you may stop using the site or the services whose terms you do not accept."],
["32. External services","The site may integrate external services such as Google, ad and analytics services, YouTube, Telegram, social media, online stores, payment services (if any), hosting, cloud storage and third-party tools. Each has its own terms and privacy policy; AQX Food does not have full control over third parties' policies or technologies."],
["33. External link security","We try to use trustworthy links but cannot guarantee that all external sites remain safe or available. Be careful when moving to any external site, downloading files or submitting data."],
["34. Advertising and measurement data","The platform or its partners may use measurement technologies to understand ad impressions, ad interaction, clicks, overall campaign performance and ad-driven visits. Some data may be anonymous or aggregated. We do not guarantee ads will always match every user's interests."],
["35. No sale of personal data","AQX Food's model is not to sell users' personal data. Data may be processed by providers who help us run the site, ads, analytics, security or technical services; using them is not intended to turn personal data into a product sold independently."],
["36. Data minimization","We believe in collecting only the data needed. Where personal data is not required for a function, it need not be provided just to browse public content. This may differ for services requiring an account, a request or a specific feature."],
["37. Using the site from outside Egypt","AQX Food may be available to users in different countries. If you access it from outside Egypt, you are responsible for ensuring your use complies with local laws that apply to you. Privacy rights differ from country to country."],
["38. Governing law and jurisdiction","This policy is interpreted and applied under the laws of the Arab Republic of Egypt, including Personal Data Protection Law No. 151 of 2020, without prejudice to mandatory rights the user may have under the laws of their country of residence.\nDisputes shall first be addressed amicably and in good faith by contacting AQX Food.\nIf amicable settlement fails, the courts of Aswan, Arab Republic of Egypt, shall have exclusive territorial jurisdiction over any dispute or claim arising out of or relating to this policy, its interpretation or enforcement, to the extent permitted by law and without prejudice to any mandatory rights of the user under applicable law."],
["39. Privacy contact","For questions or requests about privacy, personal data, deletion or correction, contact us through the official channel published on the AQX Food website.\nEmail:\ncontact@alqurmanix.com\nWebsite:\nhttps://food-aqx.alqurmanix.com/\nEntity:\nAQX Food | ALQURMANI X Kitchen\nBrand:\nALQURMANI X | AQX\nFounder:\nMohamed Bassiouny (Abu Abdullah Al-Qurmani)\nDeclared location of the platform:\nAswan, Arab Republic of Egypt"],
["40. Important notice","This policy aims to explain privacy practices transparently. It does not mean every service or data-collection technology mentioned is used on every page or at all times. Services, tools and providers may vary by page, country, device or technical updates, so relevant clauses apply according to the service you actually use."],
["41. Quick summary of your privacy","In short:\n✓ You can browse much of AQX Food without an account.\n✓ Technical and statistical data may be collected automatically to improve the site, security and performance.\n✓ The platform may use cookies and similar technologies.\n✓ Ads from third parties may appear.\n✓ Analytics and visit-measurement services may be used.\n✓ Pages may contain external and affiliate links.\n✓ External sites have independent privacy policies.\n✓ We do not aim to sell users' personal data.\n✓ You can avoid sending sensitive information through general contact forms.\n✓ You can request review, correction or deletion of data you gave us, where legally and technically possible.\n✓ Some records may be kept for legal, security or technical purposes.\n✓ This policy may change as AQX Food evolves."]
